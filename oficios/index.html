<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oficios</title>
<style>
  :root{
    --ink:#101828; --ink-soft:#475467; --ink-faint:#8a94a3;
    --paper:#f4f6f8; --surface:#ffffff; --surface-alt:#eef1f4;
    --border:#d3d9e0; --accent:#2a4a73; --accent-strong:#16304f; --accent-soft:#e2e9f2;
    --danger:#c8402f; --danger-soft:#f8e0db; --ok:#1f9d55; --ok-soft:#dff5e6; --warn:#c9820a; --warn-soft:#faedd0;
    --shadow:0 1px 2px rgba(16,24,32,.05),0 4px 12px rgba(16,24,32,.06);
    --radius-sm:7px; --radius-md:10px; --radius-lg:14px; --radius-pill:999px;
    --font-ui:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f4; --ink-soft:#aeb8c4; --ink-faint:#7c8798;
      --paper:#0a0e14; --surface:#131922; --surface-alt:#1a212b;
      --border:#28313d; --accent:#6f9bd1; --accent-strong:#9bc0e8; --accent-soft:#1b2938;
      --danger:#e8695a; --danger-soft:#3a1f1c; --ok:#5cc98a; --ok-soft:#153524; --warn:#e3a83c; --warn-soft:#3a2c12;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;min-height:100vh}
  #app-root{max-width:820px;margin:0 auto;padding:0 0 96px;min-height:100vh}
  button,input,select,textarea{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--border);padding:12px 16px 10px}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand h1{font-size:1.1rem;margin:0;font-weight:700}
  .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  main{padding:14px 16px}
  .btn{border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:600;font-size:.82rem;padding:8px 12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-strong)}
  .btn-danger{border-color:var(--danger);color:var(--danger)}
  .btn-danger:hover{background:var(--danger-soft)}
  .btn-sm{padding:5px 9px;font-size:.74rem;border-radius:var(--radius-sm)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
  .btn:disabled{opacity:.5;cursor:default}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
  .card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}
  .card h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card-title{font-weight:700;font-size:.98rem}
  .meta{color:var(--ink-soft);font-size:.78rem;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px}
  .badge{display:inline-flex;font-size:.64rem;font-weight:700;padding:3px 9px;border-radius:var(--radius-pill);text-transform:uppercase;letter-spacing:.03em;background:var(--accent-soft);color:var(--accent-strong);flex:none}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
  .empty-state{text-align:center;color:var(--ink-faint);padding:28px 18px;border:1px dashed var(--border);border-radius:var(--radius-lg);font-size:.86rem}
  .fab{position:fixed;right:18px;bottom:24px;z-index:30;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-pill);padding:13px 20px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);cursor:pointer}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .field>label{font-size:.7rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
  input[type=text],input[type=date],input[type=search],select,textarea{border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:.88rem;background:var(--surface-alt);color:var(--ink);width:100%}
  textarea{resize:vertical;min-height:60px;line-height:1.4}
  .hint{font-size:.72rem;color:var(--ink-faint);line-height:1.5;margin:4px 0 0}
  .sw{display:flex;align-items:center;flex:none;cursor:pointer}
  .sw input{width:18px;height:18px;margin:0;cursor:pointer}
  .fld{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .fld .lbl{width:34%;font-weight:600}
  .fld.off input[type=text],.fld.off textarea{opacity:.45}
  .blk{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;margin-bottom:10px;background:var(--surface)}
  .blk.off{background:var(--surface-alt)}.blk.off textarea,.blk.off table{opacity:.45}
  .blk-h{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .blk-h .tit{flex:1;font-weight:700}
  table.tb{border-collapse:collapse;width:100%;font-size:.8rem}
  table.tb th,table.tb td{border:1px solid var(--border);padding:3px}
  table.tb input{border:none;background:transparent;padding:4px;font-size:.8rem;width:100%}
  table.tb th input{font-weight:700}
  .tbw{overflow-x:auto}
  .chip{font-family:ui-monospace,Consolas,monospace;font-size:.68rem;background:var(--accent-soft);color:var(--accent-strong);border-radius:6px;padding:2px 6px;flex:none}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,14,17,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  @media (min-width:560px){.modal-overlay{align-items:center;padding:20px}}
  .modal{background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px 22px;box-shadow:var(--shadow)}
  @media (min-width:560px){.modal{border-radius:var(--radius-lg)}}
  .modal.wide{max-width:740px}
  .modal h2{margin:0 0 12px;font-size:1.05rem}
  .modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions .btn{flex:1}
  .pick{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;margin-top:8px}
  .pick button{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:8px 10px;cursor:pointer;color:var(--ink)}
  .pick button:hover{border-color:var(--accent);background:var(--accent-soft)}
  .pick small{display:block;color:var(--ink-faint);white-space:pre-line;margin-top:2px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:var(--radius-pill);font-size:.82rem;font-weight:600;box-shadow:var(--shadow);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .warn-box{background:var(--warn-soft);color:var(--warn);border-radius:var(--radius-md);padding:9px 12px;font-size:.8rem;font-weight:600;margin-bottom:12px}
  .thumb{max-height:48px;max-width:110px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:3px}
  /* vista previa */
  .paper{background:#fff;color:#000;border:1px solid var(--border);box-shadow:var(--shadow);padding:26px 30px 20px;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;line-height:1.45;margin:0 auto;max-width:620px}
  .paper .hd{display:grid;grid-template-columns:45% 55%;align-items:center;margin-bottom:34px}.paper .hd img{height:66px}.paper .hd .t div{font-size:11.5px}
  .paper .two{display:grid;grid-template-columns:47% 53%;gap:8px;margin-bottom:18px}
  .paper .two div div{min-height:1em}
  .paper p{text-align:justify;text-indent:2em;margin:0 0 9px}
  .paper .li{text-align:justify;padding-left:3.2em;text-indent:-1em;margin:0 0 4px}
  .paper table{border-collapse:collapse;width:100%;margin:6px 0 10px;font-size:10.5px}.paper td,.paper th{border:1px solid #000;padding:3px 5px;text-align:left}.paper th{background:#e8ecf1}
  .paper .at{margin:14px 0 0 2em}.paper .sig{text-align:center;margin-top:14px}.paper .sig .fdo{margin-top:26px}
  .paper .ft{display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px;font-size:9px;color:#333}.paper .ft img{height:46px}
  .miss{background:#fff3b0;padding:0 2px}
</style>
</head>
<body>
<div id="app-root"></div>
<script>
(function(){
  'use strict';
  var KEY='ofi112_state_v1', SIM_KEY='sim112_state_v1';
  var LIBS={ docx:'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js', jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js' };
  var ESTADOS=['Borrador','Pendiente de firma','Enviado','Archivado'];

  /* ================= datos por defecto (solo textos institucionales genéricos) ================= */
  function membretesDef(){ return [
    { id:'agencia', nombre:'Agencia de Emergencias de Andalucía', cabecera:['Consejería de Presidencia, Sanidad y Emergencias','Agencia de Emergencias de Andalucía.'], negritaTodas:false,
      firmaCargo:'LA JEFA DEL SERVICIO DE PROTECCIÓN CIVIL', firmaNombre:'',
      pie:['C/ Inca Garcilaso, n.º 3. Edificio Expo.','41092-Sevilla','Tfno.: 955041429','dg.emergencias.cspe@juntadeandalucia.es'], logo:'', sello:'' },
    { id:'delegacion', nombre:'Delegación del Gobierno (Málaga)', cabecera:['Delegación del Gobierno','Málaga'], negritaTodas:true,
      firmaCargo:'LA DELEGADA DEL GOBIERNO', firmaNombre:'', pie:[], logo:'', sello:'' }
  ]; }
  function refsBase(asunto){ return [
    {id:'fecha',label:'Fecha',on:true,valor:'la de firma'},
    {id:'ref',label:'Ref.',on:true,valor:''},
    {id:'nref',label:'N/Ref.',on:true,valor:''},
    {id:'asunto',label:'Asunto',on:true,valor:asunto||'',neg:true} ]; }
  function plantillasDef(){ return [
    { id:'grabaciones', nombre:'Respuesta a solicitud de grabaciones', membreteId:'agencia',
      refs:refsBase('Solicitud de grabaciones'),
      vars:[ {id:'fechaEscrito',label:'Fecha de su escrito',valor:''}, {id:'nRegistro',label:'Nº de registro de entrada',valor:''},
             {id:'fechaRegistro',label:'Fecha de registro',valor:''}, {id:'atestado',label:'Atestado / diligencias',valor:''},
             {id:'solicitud',label:'Lo que solicitan (cita textual)',valor:'',largo:true}, {id:'soporte',label:'Formato del soporte',valor:'CD'} ],
      bloques:[
        {id:'b1',tipo:'texto',titulo:'Referencia a su escrito',on:true,texto:'Con relación a su escrito de fecha {{fechaEscrito}}, con número de registro de entrada {{nRegistro}} de fecha {{fechaRegistro}}, en el que por ser necesario para una investigación, atestado {{atestado}}, solicita “{{solicitud}}”, le indicamos que:'},
        {id:'b2',tipo:'texto',titulo:'Resultado: SÍ constan llamadas',on:true,texto:'Consultada la base de datos del Sistema Emergencias 112 Andalucía, consta la siguiente llamada recibida relacionada con su petición:'},
        {id:'b3',tipo:'tabla',titulo:'Tabla de llamadas',on:true,numerar:true,cols:['Fecha','Hora','Nº teléfono','Observaciones'],filas:[]},
        {id:'b4',tipo:'texto',titulo:'Resultado: NO constan llamadas',on:false,texto:'Consultada la base de datos del Sistema Emergencias 112 Andalucía, no consta ninguna llamada recibida relacionada con su petición.'},
        {id:'b5',tipo:'texto',titulo:'Soporte que se acompaña',on:true,texto:'* Se acompaña al presente escrito el soporte informático de las grabaciones solicitadas en formato {{soporte}}.'} ],
      atentamente:{on:true,texto:'Atentamente,'} },
    { id:'generico', nombre:'Oficio genérico', membreteId:'delegacion',
      refs:refsBase(''), vars:[],
      bloques:[
        {id:'b1',tipo:'texto',titulo:'Texto principal',on:true,texto:''},
        {id:'b2',tipo:'texto',titulo:'Segundo párrafo',on:false,texto:''},
        {id:'b3',tipo:'texto',titulo:'Lista (líneas que empiezan por -)',on:false,texto:'Le solicitamos:\n- '},
        {id:'b4',tipo:'texto',titulo:'Se adjunta',on:false,texto:'Se adjunta a este escrito: '},
        {id:'b5',tipo:'texto',titulo:'Despedida',on:true,texto:'Lo que le comunico para su conocimiento y efectos oportunos.'} ],
      atentamente:{on:true,texto:'Atentamente,'} }
  ]; }
  function defaults(){
    return { membretes:membretesDef(), firmantes:[], destinatarios:[], plantillas:plantillasDef(),
      numeracion:{patron:'PMA-PD {n}/{aa} {ini}', ini:'', ultimos:{}}, oficios:[] };
  }
  function load(){
    var b=defaults();
    try{
      var s=JSON.parse(localStorage.getItem(KEY)||'null');
      if(s){ ['membretes','firmantes','destinatarios','plantillas','oficios'].forEach(function(k){ if(Array.isArray(s[k])) b[k]=s[k]; });
        if(s.numeracion) b.numeracion=Object.assign(b.numeracion,s.numeracion); }
    }catch(e){}
    return b;
  }
  var state=load();
  var ui={view:'home', id:null, buscar:'', estado:'todos'};
  var saveT=null;
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('⚠️ No se pudo guardar en este navegador'); } }
  function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(save,350); }
  function persist(m){ clearTimeout(saveT); save(); if(m) toast(m); }

  /* ================= utilidades ================= */
  function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function pad2(n){ return (n<10?'0':'')+n; }
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function fmtF(iso){ if(!iso) return ''; var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  function lines(t){ return String(t||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean); }
  function norm(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
  function slug(s,max){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[\/]+/g,'-').replace(/[^A-Za-z0-9\-]+/g,'_').replace(/^[_\-]+|[_\-]+$/g,'').slice(0,max||60).replace(/[_\-]+$/,'')||'oficio'; }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function getPath(o,p){ return p.split('.').reduce(function(a,k){ return a==null?a:a[k]; }, o); }
  function setPath(o,p,v){ var ks=p.split('.'), last=ks.pop(), t=o; ks.forEach(function(k){ t=t[k]; }); t[last]=v; }
  function cur(){ for(var i=0;i<state.oficios.length;i++) if(state.oficios[i].id===ui.id) return state.oficios[i]; return null; }
  function membrete(id){ for(var i=0;i<state.membretes.length;i++) if(state.membretes[i].id===id) return state.membretes[i]; return state.membretes[0]||{cabecera:[],pie:[]}; }
  var toastEl=null,toastT=null;
  function toast(m){ if(!toastEl){ toastEl=document.createElement('div'); toastEl.className='toast'; document.body.appendChild(toastEl); }
    toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove('show'); },3200); }
  function openModal(html,wide){ closeModal(); var w=document.createElement('div'); w.className='modal-overlay'; w.id='modal';
    w.innerHTML='<div class="modal'+(wide?' wide':'')+'">'+html+'</div>';
    w.addEventListener('click',function(e){ if(e.target===w){ closeModal(); return; } onClick(e); });
    w.addEventListener('input',onInput); w.addEventListener('change',onChange);
    document.body.appendChild(w); return w; }
  function closeModal(){ var m=document.getElementById('modal'); if(m) m.remove(); }

  /* ================= modelo del documento ================= */
  function fill(t,v,falta){
    return String(t||'').replace(/\{\{(\w+)\}\}/g,function(m,k){
      if(v.hasOwnProperty(k)){ if(v[k].valor) return v[k].valor; if(falta) falta[k]=v[k].label; return '['+v[k].label+']'; }
      return m; });
  }
  function docDe(o, falta){
    var m=membrete(o.membreteId), v={};
    o.vars.forEach(function(x){ v[x.id]=x; });
    var bl=[];
    o.bloques.forEach(function(b){
      if(!b.on) return;
      if(b.tipo==='tabla'){
        var cols=(b.numerar?['Nº']:[]).concat(b.cols);
        var filas=b.filas.map(function(r,i){ return (b.numerar?[String(i+1)]:[]).concat(r.map(function(c){ return c||''; })); });
        bl.push({k:'tabla',cols:cols,filas:filas,numerar:!!b.numerar});
      } else {
        lines(fill(b.texto,v,falta)).forEach(function(l){
          var mm=l.match(/^[-–•]\s+(.*)$/);
          bl.push(mm?{k:'li',text:mm[1]}:{k:'p',text:l});
        });
      }
    });
    var f=o.firma||{};
    return {
      cab:(m.cabecera||[]).filter(Boolean), negritaTodas:m.negritaTodas!==false, logo:m.logo||'',
      refs:o.refs.filter(function(r){ return r.on && String(r.valor||'').trim(); }).map(function(r){ return {label:r.label,valor:String(r.valor).trim(),neg:(r.neg===undefined?r.id==='asunto':!!r.neg)}; }),
      dest:o.dest.on?lines(o.dest.texto):[],
      bloques:bl,
      atent:(o.atentamente&&o.atentamente.on)?(o.atentamente.texto||''):'',
      firma:f.on===false?null:{cargo:f.cargo||m.firmaCargo||'', nombre:f.nombre||m.firmaNombre||'', extra:f.extra||''},
      pie:(o.pie&&o.pie.on===false)?[]:(m.pie||[]).filter(Boolean), sello:(o.pie&&o.pie.on===false)?'':(m.sello||'')
    };
  }
  function nombreArchivo(o,ext){
    var r=o.refs.filter(function(x){ return x.id==='nref'&&x.valor; })[0];
    return slug(r?r.valor:o.titulo,30)+'.'+ext;
  }

  /* ---- vista previa HTML ---- */
  function previewHTML(L){
    var h='<div class="paper"><div class="hd">'+(L.logo?'<img alt="" src="'+esc(L.logo)+'">':'<span></span>')+
      '<div class="t">'+L.cab.map(function(t,i){ return '<div'+((L.negritaTodas||i===0)?' style="font-weight:700"':'')+'>'+esc(t)+'</div>'; }).join('')+'</div></div>';
    h+='<div class="two"><div>'+L.refs.map(function(r){ return '<div>'+esc(r.label)+': '+(r.neg?'<b>'+esc(r.valor)+'</b>':esc(r.valor))+'</div>'; }).join('')+'</div>'+
       '<div>'+L.dest.map(function(t,i){ return '<div'+(i===0?' style="font-weight:700"':'')+'>'+esc(t)+'</div>'; }).join('')+'</div></div>';
    L.bloques.forEach(function(b){
      if(b.k==='li') h+='<div class="li">- '+marcar(b.text)+'</div>';
      else if(b.k==='p') h+='<p>'+marcar(b.text)+'</p>';
      else h+='<table><thead><tr>'+b.cols.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join('')+'</tr></thead><tbody>'+
        (b.filas.length?b.filas.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>'; }).join(''):'<tr>'+b.cols.map(function(){return '<td>&nbsp;</td>';}).join('')+'</tr>')+'</tbody></table>';
    });
    if(L.atent) h+='<div class="at">'+esc(L.atent)+'</div>';
    if(L.firma) h+='<div class="sig"><div>'+esc(L.firma.cargo)+'</div>'+(L.firma.extra?'<div>'+esc(L.firma.extra)+'</div>':'')+'<div class="fdo">'+esc(L.firma.nombre)+'</div></div>';
    if(L.pie.length||L.sello) h+='<div class="ft"><div>'+L.pie.map(function(t){ return '<div>'+esc(t)+'</div>'; }).join('')+'</div>'+(L.sello?'<img alt="" src="'+esc(L.sello)+'">':'')+'</div>';
    return h+'</div>';
  }
  function marcar(t){ return esc(t).replace(/\[([^\]]+)\]/g,'<span class="miss">[$1]</span>'); }

  /* ---- librerías (carga perezosa) ---- */
  var loaded={};
  function loadLib(n){ if(loaded[n]) return loaded[n];
    loaded[n]=new Promise(function(res,rej){ var s=document.createElement('script'); s.src=LIBS[n]; s.onload=function(){res();}; s.onerror=function(){ loaded[n]=null; rej(new Error('No se pudo cargar la librería «'+n+'» (¿sin conexión?)')); }; document.head.appendChild(s); });
    return loaded[n]; }
  function u8(uri){ var b=atob(String(uri).split(',')[1]); var a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }

  function wrapW(doc,text,wf){ var ws=text.split(/\s+/).filter(Boolean),out=[],cur=[]; ws.forEach(function(w){ var t=cur.concat([w]).join(' ');

    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    var top=60, dx=mL+88, dw=W-mR-dx, y1=top, y2=top;
    L.dest.forEach(function(l,i){ doc.setFont('helvetica',i===0?'bold':'normal'); doc.splitTextToSize(l,dw).forEach(function(s){ doc.text(s,dx,y1); y1+=5.2; }); });
    doc.setFont('helvetica','normal');
    L.refs.forEach(function(r){ var lb=r.label+': '; doc.setFont('helvetica','normal'); var lw=doc.getTextWidth(lb); doc.text(lb,mL,y2); doc.setFont('helvetica',r.neg?'bold':'normal'); doc.splitTextToSize(r.valor,dx-mL-6-lw).forEach(function(s){ doc.text(s,mL+lw,y2); y2+=5.2; }); doc.setFont('helvetica','normal'); });
    y=Math.max(y1,y2)+10; doc.setFontSize(11);

      if(b.k==='p'){ var ls=wrapW(doc,b.text,function(n){return n===0?cw-10:cw;}); ls.forEach(function(ws,j){ need(5.6); jline(ws,mL+(j===0?10:0),j===0?cw-10:cw,j===ls.length-1); y+=5.6; }); y+=pegado?0.8:3; }
      else if(b.k==='li'){ var lx=mL+10,tx=lx+doc.getTextWidth('- '),w=cw-(tx-mL); var l2=wrapW(doc,b.text,function(){return w;});

        var tot=wts.reduce(function(a,x){return a+x;},0), ws=wts.map(function(x){ return x/tot*cw; });

      case 'quitar-dest': state.destinatarios.splice(ii,1); persist(); rerender(); break;
      case 'quitar-plantilla': if(state.plantillas.length>1 && window.confirm('¿Eliminar esta plantilla?')){ state.plantillas.splice(ii,1); persist(); rerender(); } else if(state.plantillas.length<=1) toast('Debe quedar al menos una plantilla'); break;
      case 'nuevo-membrete': openMembrete(null); break;
      case 'edit-membrete': openMembrete(i); break;
      case 'del-membrete': if(state.membretes.length>1 && window.confirm('¿Eliminar este membrete?')){ state.membretes=state.membretes.filter(function(x){return x.id!==i;}); persist(); rerender(); } else if(state.membretes.length<=1) toast('Debe quedar al menos un membrete'); break;
      case 'copiar-membrete-sim': copiarMembreteSim(); break;
      case 'exportar': saveBlob(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'oficios_datos_'+todayISO()+'.json'); toast('✅ Exportado (guárdalo en un sitio privado)'); break;
      case 'importar': document.getElementById('fileImport').click(); break;
    }
  }
  function importar(file){ var r=new FileReader(); r.onload=function(){ try{ var d=JSON.parse(r.result), n=0;
      (d.membretes||[]).forEach(function(m){ var ex=state.membretes.filter(function(x){return x.id===m.id;})[0]; if(ex){ Object.keys(m).forEach(function(k){ var v=m[k]; if(v!==''&&v!=null&&!(Array.isArray(v)&&!v.length)) ex[k]=v; }); } else state.membretes.push(m); });
      (d.firmantes||[]).forEach(function(f){ if(!state.firmantes.some(function(x){return x.cargo===f.cargo&&x.nombre===f.nombre;})) state.firmantes.push(f); });
      (d.destinatarios||[]).forEach(function(x){ if(!state.destinatarios.some(function(y){return y.nombre===x.nombre;})) state.destinatarios.push(x); });
      (d.plantillas||[]).forEach(function(p){ var ex=state.plantillas.filter(function(x){return x.id===p.id;})[0]; if(ex) state.plantillas[state.plantillas.indexOf(ex)]=p; else state.plantillas.push(p); });
      (d.oficios||[]).forEach(function(o){ if(!state.oficios.some(function(x){return x.id===o.id;})){ state.oficios.push(o); n++; } });
      if(d.numeracion){ state.numeracion.patron=d.numeracion.patron||state.numeracion.patron; if(d.numeracion.ini) state.numeracion.ini=d.numeracion.ini; Object.keys(d.numeracion.ultimos||{}).forEach(function(k){ state.numeracion.ultimos[k]=Math.max(+state.numeracion.ultimos[k]||0,+d.numeracion.ultimos[k]||0); }); }
      persist('✅ Importado ('+n+' oficio'+(n===1?'':'s')+' nuevo'+(n===1?'':'s')+')'); rerender(); }catch(e){ toast('⚠️ El fichero no es válido'); } }; r.readAsText(file); }

  /* ================= eventos ================= */
  function onClick(ev){ var t=ev.target.closest('[data-act]'); if(!t) return; ev.preventDefault(); accion(t.getAttribute('data-act'),t); }
  function onInput(ev){
    var t=ev.target;
    if(t.id==='buscarOfi'){ ui.buscar=t.value; rerenderKeep('buscarOfi'); return; }
    if(t.id==='buscarDest'){ pintarDest(t.value); return; }
    if(t.getAttribute&&t.getAttribute('data-bn')){ state.numeracion[t.getAttribute('data-bn')]=t.value; saveSoon(); return; }
    if(t.id==='ultimoNum'){ state.numeracion.ultimos[String(new Date().getFullYear()).slice(-2)]=parseInt(t.value,10)||0; saveSoon(); return; }
    var p=t.getAttribute&&t.getAttribute('data-b'); if(p && t.type!=='checkbox' && t.tagName!=='SELECT'){ var o=cur(); if(o){ setPath(o,p,t.value); saveSoon(); } }
  }
  function rerenderKeep(id){ var pos=(document.getElementById(id)||{}).selectionStart; rerender(); var el=document.getElementById(id); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} } }
  function onChange(ev){
    var t=ev.target, o=cur();
    if(t.id==='estadoOfi'){ ui.estado=t.value; rerender(); return; }
    if(t.id==='fileImport' && t.files[0]){ importar(t.files[0]); t.value=''; return; }
    if(t.id==='selFirmante'){ var f=state.firmantes[+t.value]; if(f&&o){ o.firma.cargo=f.cargo; o.firma.nombre=f.nombre; persist(); rerender(); } return; }
    var bc=t.getAttribute&&t.getAttribute('data-bc');
    if(bc&&o){ setPath(o,bc,t.checked); var box=t.closest('.fld,.blk'); if(box) box.classList.toggle('off',!t.checked); saveSoon(); return; }
    var b=t.getAttribute&&t.getAttribute('data-b'); if(b&&o&&(t.tagName==='SELECT'||t.type==='date')){ setPath(o,b,t.value); persist(); if(b==='membreteId') rerender(); }
  }
  var root=document.getElementById('app-root');
  root.addEventListener('click',onClick); root.addEventListener('input',onInput); root.addEventListener('change',onChange);
  render();
})();
</script>
</body>
