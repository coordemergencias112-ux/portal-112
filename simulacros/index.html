<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitaciones a Simulacros</title>
<style>
  :root{
    --ink:#101828; --ink-soft:#475467; --ink-faint:#8a94a3;
    --paper:#f4f6f8; --surface:#ffffff; --surface-alt:#eef1f4;
    --border:#d3d9e0; --accent:#2a4a73; --accent-strong:#16304f; --accent-soft:#e2e9f2;
    --danger:#c8402f; --danger-soft:#f8e0db; --ok:#1f9d55; --ok-soft:#dff5e6; --warn:#c9820a; --warn-soft:#faedd0;
    --font-ui:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono:ui-monospace,"Cascadia Code",Consolas,monospace;
    --shadow:0 1px 2px rgba(16,24,32,.05),0 4px 12px rgba(16,24,32,.06);
    --radius-sm:7px; --radius-md:10px; --radius-lg:14px; --radius-pill:999px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f4; --ink-soft:#aeb8c4; --ink-faint:#7c8798;
      --paper:#0a0e14; --surface:#131922; --surface-alt:#1a212b;
      --border:#28313d; --accent:#6f9bd1; --accent-strong:#9bc0e8; --accent-soft:#1b2938;
      --danger:#e8695a; --danger-soft:#3a1f1c; --ok:#5cc98a; --ok-soft:#153524; --warn:#e3a83c; --warn-soft:#3a2c12;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;min-height:100vh}
  #app-root{max-width:760px;margin:0 auto;padding:0 0 96px;min-height:100vh}
  button,input,select,textarea{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--border);padding:14px 16px 10px}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand h1{font-size:1.1rem;margin:0;font-weight:700;letter-spacing:-.01em}
  .topbar-actions{display:flex;gap:4px}
  main{padding:16px}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;gap:8px;flex-wrap:wrap}
  .section-title:first-child{margin-top:4px}
  .section-title h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:0;font-weight:700}
  .btn{border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:600;font-size:.85rem;padding:9px 14px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
  .btn-danger{border-color:var(--danger);color:var(--danger)}
  .btn-danger:hover{background:var(--danger-soft)}
  .btn-sm{padding:6px 10px;font-size:.76rem;border-radius:var(--radius-sm)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
  .btn:disabled{opacity:.5;cursor:default}
  .card-list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow)}
  .card.click{cursor:pointer}
  .card.click:hover{border-color:var(--accent)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card-title{font-weight:700;font-size:1rem}
  .meta{color:var(--ink-soft);font-size:.8rem;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
  .badge{display:inline-flex;align-items:center;font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:var(--radius-pill);text-transform:uppercase;letter-spacing:.03em;flex:none;background:var(--accent-soft);color:var(--accent-strong)}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.bad{background:var(--danger-soft);color:var(--danger)}
  .empty-state{text-align:center;color:var(--ink-faint);padding:30px 18px;border:1px dashed var(--border);border-radius:var(--radius-lg);font-size:.88rem}
  .fab{position:fixed;right:18px;bottom:24px;z-index:30;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-pill);padding:13px 20px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);cursor:pointer}
  .fab:hover{background:var(--accent-strong)}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:.82rem}
  .detail-grid .k{color:var(--ink-faint);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .detail-grid .v{font-weight:600;word-break:break-word}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .op-row{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px}
  .op-row.sel{border-color:var(--accent);background:var(--accent-soft)}
  .op-row input[type=checkbox]{margin-top:3px;width:17px;height:17px;flex:none;cursor:pointer}
  .op-main{flex:1;min-width:0}
  .op-name{font-weight:700;font-size:.88rem}
  .op-dest{color:var(--ink-soft);font-size:.76rem;margin-top:2px;white-space:pre-line}
  .op-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .op-tools select{border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 8px;font-size:.76rem;background:var(--surface);color:var(--ink)}
  .list{display:flex;flex-direction:column;gap:8px}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,14,17,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  @media (min-width:560px){.modal-overlay{align-items:center;padding:20px}}
  .modal{background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px 22px;box-shadow:var(--shadow)}
  @media (min-width:560px){.modal{border-radius:var(--radius-lg)}}
  .modal.wide{max-width:720px}
  .modal h2{margin:0 0 14px;font-size:1.05rem}
  .field{margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
  .field label{font-size:.72rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
  .field input,.field select,.field textarea{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;font-size:.9rem;background:var(--surface-alt);color:var(--ink);width:100%}
  .field textarea{resize:vertical;min-height:70px;line-height:1.4}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .modal-actions{display:flex;gap:8px;margin-top:16px}
  .modal-actions .btn{flex:1}
  .hint{font-size:.72rem;color:var(--ink-faint);line-height:1.5;margin:4px 0 0}
  .check{display:flex;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}
  /* las casillas dentro de un .field no deben heredar el estilo de las etiquetas (mayúsculas, negrita, 100% de ancho) */
  .field label.check{flex-direction:row;text-transform:none;letter-spacing:0;font-weight:500;font-size:.85rem;color:var(--ink);line-height:1.35;cursor:pointer}
  .field label.check input[type=checkbox]{width:17px;height:17px;flex:none;padding:0;margin:0;cursor:pointer}
  .opciones-part{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;background:var(--surface-alt)}
  .opciones-part label.check{margin:0;padding:6px 6px;border-radius:6px}
  .opciones-part label.check:hover{background:var(--accent-soft)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:var(--radius-pill);font-size:.82rem;font-weight:600;box-shadow:var(--shadow);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  /* vista previa de la carta */
  .paper{background:#fff;color:#000;border:1px solid var(--border);box-shadow:var(--shadow);padding:26px 30px 20px;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;line-height:1.45;margin:0 auto;max-width:600px}
  .paper .hd{display:flex;align-items:center;gap:26px;margin-bottom:22px}
  .paper .hd img{height:52px}
  .paper .hd b{display:block;font-size:12px}
  .paper .two{display:grid;grid-template-columns:38% 62%;gap:8px;margin-bottom:16px}
  .paper .dest div{min-height:1em}
  .paper p{text-align:justify;text-indent:2em;margin:0 0 10px}
  .paper .li{text-align:justify;padding-left:3.2em;text-indent:-1em;margin:0 0 4px}
  .paper .sig{text-align:center;margin-top:18px}
  .paper .sig .fdo{margin-top:34px}
  .paper .ft{display:flex;justify-content:space-between;align-items:flex-end;margin-top:28px;font-size:9px;color:#333}
  .paper .ft img{height:46px}
  .warn-box{background:var(--warn-soft);color:var(--warn);border-radius:var(--radius-md);padding:9px 12px;font-size:.8rem;font-weight:600;margin-bottom:12px}
  .thumb{max-height:54px;max-width:120px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:3px}
</style>
</head>
<body>
<div id="app-root"></div>
<script>
(function(){
  'use strict';

  /* ================= datos por defecto ================= */
  var KEY = 'sim112_state_v1';
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var LIBS = {
    docx: 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js',
    jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js',
    jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.2/jszip.min.js'
  };
  var ESTADOS = ['Pendiente','Enviada','Confirmada','No participa'];

  var P1_DEF = 'En el marco de lo dispuesto en el {{plan}} y con el objetivo de evaluar y mejorar los procedimientos operativos de respuesta ante emergencias en el entorno forestal, se llevará a cabo un simulacro de {{tipo}} en el término municipal de {{municipio}} el próximo {{fecha}}, en horario aproximado de {{horaIni}} a {{horaFin}} horas.';
  var P2_DEF = 'Este ejercicio tiene como finalidad poner a prueba los mecanismos de coordinación entre los distintos operativos y evaluar la capacidad de respuesta conjunta ante un escenario de {{escenario}} de especial complejidad. Durante el simulacro se activarán los Protocolos y Planes establecidos y participarán los distintos operativos que intervienen habitualmente en este tipo de emergencias.{{borrador}}';
  var P3_DEF = 'Agradeciendo de antemano su colaboración y participación, reciban un cordial saludo.';
  var BORRADOR_DEF = 'En los próximos días recibirán un borrador del mismo y un anexo para que informen de los medios y recursos que disponen para su participación.';

  // Solo nombres de organismos (información pública). Los nombres y direcciones de las
  // personas destinatarias NO van en el código: se rellenan en el navegador o se importan.
  var CATALOGO_DEF = [
    ['ces061','CES 061 (Centro de Emergencias Sanitarias)'],
    ['cruzroja','Cruz Roja — Unidad de Emergencias'],
    ['giped','GIPED'],
    ['upn','Unidad de Policía Nacional adscrita a la Comunidad Autónoma'],
    ['bomberos','Bomberos — Consorcio Provincial de Málaga'],
    ['diputacion','Diputación de Málaga — Servicio Social Comunitario'],
    ['cptsocial','Colegio Profesional de Trabajo Social'],
    ['subdelegacion','Subdelegación del Gobierno (Guardia Civil y Protección Civil)'],
    ['remer','REMER'],
    ['consulado','Consulado Británico en Málaga'],
    ['ama','Agentes de Medio Ambiente'],
    ['dgt','DGT'],
    ['ayto-benaojan','ALVPC / Ayuntamiento de Benaoján'],
    ['ayto-ronda','ALVPC / Ayuntamiento de Ronda'],
    ['ayto-algatocin','ALVPC / Ayuntamiento de Algatocín'],
    ['ayto-manilva','ALVPC / Ayuntamiento de Manilva'],
    ['ayto-cortes','ALVPC / Ayuntamiento de Cortes de la Frontera'],
    ['ayto-afectado','Ayuntamiento del municipio del simulacro — Policía Local']
  ].map(function(x){ return { id:x[0], nombre:x[1], destinatario:'' }; });

  // Participación solicitada: opciones que se pueden marcar (una por línea de la lista) y
  // plantillas completas de un clic. Solo hay textos genéricos; las que lleven nombres de
  // personas las añade cada usuario (se guardan en su navegador / fichero privado).
  var OPCIONES_PART_DEF = [
    'Policía Local',
    'Agrupación de Voluntarios de Protección Civil',
    'Unidad de Protección Civil de la Subdelegación del Gobierno de Málaga.',
    'Guardia Civil.',
    'Red Nacional de Radio de Emergencia (REMER).',
    'Consorcio Provincial de Bomberos.',
    'Servicios Sociales Comunitarios',
    'Agentes de Medio Ambiente',
    'Policía Nacional'
  ];
  var PLANTILLAS_PART_DEF = [
    { nombre:'Ayuntamiento (Policía Local y Voluntarios PC)', texto:'Le solicitamos la participación de su:\n- Policía Local\n- Agrupación de Voluntarios de Protección Civil' },
    { nombre:'Subdelegación del Gobierno', texto:'Le solicitamos participación de:\n- Unidad de Protección Civil de la Subdelegación del Gobierno de Málaga.\n- Guardia Civil.\n- Red Nacional de Radio de Emergencia (REMER).' }
  ];
  var INTRO_PART = 'Le solicitamos la participación de:';

  function defaults(){
    return {
      membrete: { cabecera:['Delegación del Gobierno','Málaga'], firmaCargo:'LA DELEGADA DEL GOBIERNO', firmaNombre:'', pie:[], logo:'', sello:'' },
      plantilla: { p1:P1_DEF, p2:P2_DEF, p3:P3_DEF, borrador:BORRADOR_DEF },
      catalogo: CATALOGO_DEF.map(function(c){ return {id:c.id,nombre:c.nombre,destinatario:''}; }),
      opcionesPart: OPCIONES_PART_DEF.slice(),
      plantillasPart: PLANTILLAS_PART_DEF.map(function(p){ return {nombre:p.nombre,texto:p.texto}; }),
      simulacros: []
    };
  }
  function load(){
    var base = defaults();
    try{
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(s){
        base.membrete = Object.assign(base.membrete, s.membrete || {});
        base.plantilla = Object.assign(base.plantilla, s.plantilla || {});
        if(Array.isArray(s.catalogo)) base.catalogo = s.catalogo;
        if(Array.isArray(s.simulacros)) base.simulacros = s.simulacros;
        if(Array.isArray(s.opcionesPart)) base.opcionesPart = s.opcionesPart;
        if(Array.isArray(s.plantillasPart)) base.plantillasPart = s.plantillasPart;
      }
    }catch(e){}
    return base;
  }
  var state = load();
  var ui = { view:'home', simId:null, buscar:'', grupo:'todos', buscarCat:'' };
  // Los ayuntamientos se agrupan aparte del resto de organismos (son más de cien).
  function esAyto(o){ return /^(ALVPC\s*\/|Ayuntamiento)/i.test(o.nombre||''); }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('⚠️ No se pudo guardar en este navegador'); } }
  function persist(msg){ save(); if(msg) toast(msg); }

  /* ================= utilidades ================= */
  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function pad2(n){ return (n<10?'0':'')+n; }
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function parseISO(iso){ if(!iso) return null; var p=iso.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtDia(iso){ var d=parseISO(iso); return d? d.getDate()+' de '+MESES[d.getMonth()] : ''; }
  function fmtCompleta(iso){ var d=parseISO(iso); return d? d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear() : '—'; }
  function diasHasta(iso){ var d=parseISO(iso); if(!d) return null; var h=parseISO(todayISO()); return Math.round((d-h)/86400000); }
  function sim(id){ for(var i=0;i<state.simulacros.length;i++) if(state.simulacros[i].id===id) return state.simulacros[i]; return null; }
  function op(id){ for(var i=0;i<state.catalogo.length;i++) if(state.catalogo[i].id===id) return state.catalogo[i]; return null; }
  function lines(t){ return String(t||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean); }
  function slug(s, max){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,max||60).replace(/_+$/,'') || 'carta'; }
  function fill(t, v){ return String(t||'').replace(/\{\{(\w+)\}\}/g,function(m,k){ return v[k]!=null ? v[k] : m; }); }

  var toastEl=null, toastT=null;
  function toast(msg){
    if(!toastEl){ toastEl=document.createElement('div'); toastEl.className='toast'; document.body.appendChild(toastEl); }
    toastEl.textContent=msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove('show'); }, 3200);
  }

  function openModal(html, wide){
    closeModal();
    var w=document.createElement('div'); w.className='modal-overlay'; w.id='modal';
    w.innerHTML='<div class="modal'+(wide?' wide':'')+'">'+html+'</div>';
    w.addEventListener('click', function(e){ if(e.target===w){ closeModal(); return; } onClick(e); });
    document.body.appendChild(w);
    return w;
  }
  function closeModal(){ var m=document.getElementById('modal'); if(m) m.remove(); }

  /* ================= la carta ================= */
  function vars(s){
    return {
      plan:s.plan, tipo:s.tipo, escenario:s.escenario, municipio:s.municipio,
      fecha:fmtDia(s.fecha), fechaCompleta:fmtCompleta(s.fecha),
      horaIni:s.horaIni, horaFin:s.horaFin, nombre:s.nombre,
      borrador: s.borrador ? ' '+String(state.plantilla.borrador||'').trim() : ''
    };
  }
  // Participación solicitada a este destinatario: texto libre, una línea por renglón.
  // Las líneas que empiezan por "-" salen como viñeta; el resto, como párrafo.
  // Vale la de este simulacro si se ha cambiado; si no, la predeterminada del operativo.
  function participacionDe(part, o){
    if(part && part.participacion != null) return part.participacion;
    return (o && o.participacion) || '';
  }
  function bloquesDe(s, part, o, v){
    function limpio(t){ return String(t||'').replace(/\s+/g,' ').trim(); }
    var out=[{k:'p',text:limpio(fill(s.p1,v))}, {k:'p',text:limpio(fill(s.p2,v))}];
    lines(participacionDe(part,o)).forEach(function(l){
      var m=l.match(/^[-–•*]\s*(.*)$/);
      out.push(m ? {k:'li',text:limpio(m[1])} : {k:'p',text:limpio(l)});
    });
    out.push({k:'p',text:limpio(fill(s.p3,v))});
    return out.filter(function(b){ return b.text; });
  }
  // Datos ya resueltos de una carta concreta (los usan la vista previa, el Word y el PDF).
  function cartaDe(s, part){
    var v=vars(s), m=state.membrete, o=op(part.opId);
    return {
      cabecera: (m.cabecera||[]).filter(Boolean),
      fecha: s.fechaCarta || 'la de la firma',
      asunto: s.asunto || ('Simulacro '+s.nombre),
      dest: lines(o ? o.destinatario : ''),
      destNombre: o ? o.nombre : '',
      bloques: bloquesDe(s, part, o, v),
      // La firma puede cambiarse por simulacro; si está vacía se usa la de Ajustes.
      cargo: s.firmaCargo || m.firmaCargo || '', firmante: s.firmaNombre || m.firmaNombre || '',
      pie: (m.pie||[]).filter(Boolean), logo: m.logo||'', sello: m.sello||''
    };
  }
  // Nombres de archivo cortos: Windows/OneDrive/unidades de red fallan con rutas de más de ~260
  // caracteres, y el nombre del simulacro + el del operativo completo se pasaba de largo.
  var CORTOS = { ces061:'CES061', cruzroja:'CruzRoja', giped:'GIPED', upn:'UPN', bomberos:'Bomberos', diputacion:'Diputacion',
    cptsocial:'ColTrabSocial', subdelegacion:'Subdelegacion', remer:'REMER', consulado:'ConsuladoUK', ama:'AMA', dgt:'DGT',
    'ayto-benaojan':'Benaojan', 'ayto-ronda':'Ronda', 'ayto-algatocin':'Algatocin', 'ayto-manilva':'Manilva',
    'ayto-cortes':'CortesFrontera', 'ayto-afectado':'AytoAfectado' };
  function cortoDe(o){
    if(!o) return 'carta';
    if(o.corto && o.corto.trim()) return slug(o.corto, 20);
    if(CORTOS[o.id]) return CORTOS[o.id];
    var n=String(o.nombre||'').replace(/\([^)]*\)/g,' ').split(/\s+[—–-]\s+/)[0];
    if(n.indexOf('/')>-1) n=n.split('/').pop();
    n=n.replace(/\b(de|del|la|las|los|el|y|en)\b/gi,' ');
    return slug(n, 20);
  }
  function cortoSim(s){ return slug(String(s.nombre||'').replace(/^simulacro\s+/i,'').replace(/\b(de|del|la|las|los|el|y|en)\b/gi,' '), 18); }
  // enZip: dentro del ZIP basta el nombre del operativo (la carpeta ya dice de qué simulacro es).

  /* ---- carga perezosa de librerías (si la CDN falla, el resto de la app sigue) ---- */
  var loaded = {};
  function loadLib(name){
    if(loaded[name]) return loaded[name];
    loaded[name] = new Promise(function(res, rej){
      var s=document.createElement('script'); s.src=LIBS[name];
      s.onload=function(){ res(); };
      s.onerror=function(){ loaded[name]=null; rej(new Error('No se pudo cargar la librería "'+name+'" (¿sin conexión?)')); };
      document.head.appendChild(s);
    });
    return loaded[name];
  }
  function u8(uri){ var b=atob(String(uri).split(',')[1]); var a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function imgType(uri){ return /^data:image\/(jpe?g)/i.test(uri) ? 'jpg' : 'png'; }
  function imgSize(uri){ return new Promise(function(res){ var i=new Image(); i.onload=function(){ res({w:i.naturalWidth,h:i.naturalHeight}); }; i.onerror=function(){ res({w:1,h:1}); }; i.src=uri; }); }

  /* ---- Word (.docx) ---- */
  async function docxSection(D, L){
    var none={style:D.BorderStyle.NONE,size:0,color:'FFFFFF'};
    var nb={top:none,bottom:none,left:none,right:none};
    function run(t,o){ o=o||{}; return new D.TextRun({text:t,bold:!!o.bold,size:o.size||22,font:'Arial'}); }
    function para(t,o){ o=o||{}; return new D.Paragraph({children:[run(t,o)],alignment:o.align,spacing:o.spacing,indent:o.indent}); }
    function tbl(widths, cols){
      return new D.Table({
        width:{size:widths.reduce(function(a,b){return a+b;},0),type:D.WidthType.DXA}, columnWidths:widths,
        borders:{top:none,bottom:none,left:none,right:none,insideHorizontal:none,insideVertical:none},
        rows:[new D.TableRow({children:cols.map(function(c,i){
          return new D.TableCell({children:c.length?c:[new D.Paragraph('')],width:{size:widths[i],type:D.WidthType.DXA},borders:nb});
        })})]
      });
    }
    async function img(uri, hPx){
      var sz=await imgSize(uri); var w=Math.round(hPx*sz.w/sz.h);
      return new D.Paragraph({children:[new D.ImageRun({data:u8(uri),transformation:{width:w,height:hPx},type:imgType(uri)})]});
    }
    var head = tbl([3300,5204],[ L.logo?[await img(L.logo,78)]:[], L.cabecera.map(function(t){return para(t,{bold:true});}) ]);
    var selloP = L.sello ? await img(L.sello,71) : new D.Paragraph('');
    var foot = tbl([6800,1704],[ L.pie.map(function(t){return para(t,{size:15});}), [selloP] ]);

    var children=[
      para('',{spacing:{after:360}}),
      tbl([3300,5204],[
        [para('Fecha: '+L.fecha), para(''), para('Asunto: '+L.asunto)],
        L.dest.map(function(t){return para(t);})
      ]),
      para('')
    ];
    L.bloques.forEach(function(b, i){
      if(b.k==='li'){
        var sigueLista = L.bloques[i+1] && L.bloques[i+1].k==='li';
        children.push(new D.Paragraph({children:[run('- '+b.text)],alignment:D.AlignmentType.JUSTIFIED,spacing:{after:sigueLista?60:200,line:312},indent:{left:1134,hanging:284}}));
      } else {
        // un párrafo que introduce una lista queda pegado a ella
        var introLista = L.bloques[i+1] && L.bloques[i+1].k==='li';
        children.push(new D.Paragraph({children:[run(b.text)],alignment:D.AlignmentType.JUSTIFIED,spacing:{after:introLista?80:200,line:312},indent:{firstLine:567}}));
      }
    });
    children.push(para(L.cargo,{align:D.AlignmentType.CENTER,spacing:{before:400}}));
    children.push(para(L.firmante,{align:D.AlignmentType.CENTER,spacing:{before:700}}));

    return {
      properties:{page:{size:{width:11906,height:16838},margin:{top:1134,right:1701,bottom:1134,left:1701,header:567,footer:567}}},
      headers:{default:new D.Header({children:[head]})},
      footers:{default:new D.Footer({children:[foot]})},
      children:children
    };
  }
  async function docxBlob(Ls){
    await loadLib('docx');
    var D=window.docx, sections=[];
    for(var i=0;i<Ls.length;i++) sections.push(await docxSection(D, Ls[i]));
    var doc=new D.Document({styles:{default:{document:{run:{font:'Arial',size:22}}}},sections:sections});
    return D.Packer.toBlob(doc);
  }

  /* ---- PDF (jsPDF) ---- */
  function wrapWords(doc, text, widthFn){
    var words=text.split(/\s+/).filter(Boolean), out=[], cur=[];
    words.forEach(function(w){
      var test=cur.concat([w]).join(' ');
      if(!cur.length || doc.getTextWidth(test) <= widthFn(out.length)) cur.push(w);
      else { out.push(cur); cur=[w]; }
    });
    if(cur.length) out.push(cur);
    return out;
  }
  function drawJustified(doc, text, x, y, cw, indent, lh){
    var ls=wrapWords(doc,text,function(i){return i===0?cw-indent:cw;});
    ls.forEach(function(ws,i){
      var lx=x+(i===0?indent:0), w=i===0?cw-indent:cw;
      if(i===ls.length-1){ doc.text(ws.join(' '),lx,y); }
      else {
        var tw=ws.reduce(function(a,s){return a+doc.getTextWidth(s);},0);
        var gap=(w-tw)/Math.max(ws.length-1,1), cx=lx;
        ws.forEach(function(s){ doc.text(s,cx,y); cx+=doc.getTextWidth(s)+gap; });
      }
      y+=lh;
    });
    return y;
  }
  async function pdfLetter(doc, L, first){
    if(!first) doc.addPage();
    var W=210, mL=24, mR=22, cw=W-mL-mR;
    if(L.logo){ var sz=await imgSize(L.logo); var h=20.6, w=h*sz.w/sz.h; doc.addImage(L.logo, imgType(L.logo)==='jpg'?'JPEG':'PNG', mL, 14, w, h); }
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    L.cabecera.forEach(function(t,i){ doc.text(t, 112, 21+i*5.5); });
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    var top=54, dx=100, dw=W-mR-dx, y1=top;
    L.dest.forEach(function(l){ doc.splitTextToSize(l,dw).forEach(function(s){ doc.text(s,dx,y1); y1+=5.2; }); });
    var y2=top+1;
    doc.text('Fecha: '+L.fecha, mL, y2); y2+=11;
    doc.splitTextToSize('Asunto: '+L.asunto, dx-mL-6).forEach(function(s){ doc.text(s,mL,y2); y2+=5.2; });
    var y=Math.max(y1,y2)+12;
    doc.setFontSize(11);
    L.bloques.forEach(function(b, i){
      var sig=L.bloques[i+1], listaSigue = sig && sig.k==='li';
      if(b.k==='li'){
        // viñeta con sangría francesa: "- " en x+10 y el texto alineado un poco más adentro
        var lx=mL+10, tx=lx+doc.getTextWidth('- ');
        var ls=wrapWords(doc,b.text,function(){return cw-(tx-mL);});
        ls.forEach(function(ws,j){
          if(j===0) doc.text('-', lx, y);
          var w=cw-(tx-mL);
          if(j===ls.length-1){ doc.text(ws.join(' '),tx,y); }
          else {
            var tw=ws.reduce(function(a,s){return a+doc.getTextWidth(s);},0), gap=(w-tw)/Math.max(ws.length-1,1), cx=tx;
            ws.forEach(function(s){ doc.text(s,cx,y); cx+=doc.getTextWidth(s)+gap; });
          }
          y+=5.6;
        });
        y+= (sig && sig.k==='li') ? 0.8 : 3;
      } else {
        y=drawJustified(doc,b.text,mL,y,cw,10,5.6)+(listaSigue?0.8:3);
      }
    });
    y+=8;
    doc.text(L.cargo, W/2, y, {align:'center'}); y+=22;
    doc.text(L.firmante, W/2, y, {align:'center'});
    // pie
    doc.setFontSize(7.5); doc.setTextColor(60,60,60);
    L.pie.forEach(function(t,i){ doc.text(t, mL, 278+i*3.6); });
    doc.setTextColor(0,0,0);
    if(L.sello){ var s2=await imgSize(L.sello); var hh=19, ww=hh*s2.w/s2.h; doc.addImage(L.sello, imgType(L.sello)==='jpg'?'JPEG':'PNG', W-mR-ww, 268, ww, hh); }
  }
  async function pdfBlob(Ls){
    await loadLib('jspdf');
    var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    for(var i=0;i<Ls.length;i++) await pdfLetter(doc, Ls[i], i===0);
    return doc.output('blob');
  }

  /* ---- descargas ---- */
  function saveBlob(blob, name){
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  function seleccion(s){ return s.participantes.filter(function(p){ return op(p.opId); }); }
  function sinDestino(s, parts){ return parts.filter(function(p){ var o=op(p.opId); return !o || !lines(o.destinatario).length; }); }
  function confirmarSinDestino(s, parts){
    var falta=sinDestino(s, parts);
    if(!falta.length) return true;
    return window.confirm('Estos operativos no tienen destinatario rellenado:\n\n— '+falta.map(function(p){return op(p.opId).nombre;}).join('\n— ')+'\n\n¿Generar las cartas igualmente (con el bloque de destinatario vacío)?');
  }
  async function descargarUna(sid, opId, fmt){
    var s=sim(sid); if(!s) return;
    var part=s.participantes.filter(function(p){return p.opId===opId;})[0]; if(!part) return;
    if(!confirmarSinDestino(s,[part])) return;
    try{
      toast('Generando…');
      var L=cartaDe(s,part);
      var blob = fmt==='docx' ? await docxBlob([L]) : await pdfBlob([L]);
      saveBlob(blob, nombreArchivo(s,part,fmt));
      toast('✅ Carta descargada ('+fmt.toUpperCase()+')');
    }catch(e){ toast('⚠️ '+e.message); }
  }
  async function descargarTodas(sid, fmt){
    var s=sim(sid); if(!s) return;
    var parts=seleccion(s);
    if(!parts.length){ toast('Selecciona al menos un operativo'); return; }
    if(!confirmarSinDestino(s,parts)) return;
    try{
      toast('Generando '+parts.length+' cartas…');
      if(fmt==='pdfunico'){
        var blobU=await pdfBlob(parts.map(function(p){return cartaDe(s,p);}));
        saveBlob(blobU, 'Inv_'+cortoSim(s)+'_todas.pdf'); toast('✅ PDF único descargado'); return;
      }
      await loadLib('jszip');
      var zip=new window.JSZip(), usados={};
      for(var i=0;i<parts.length;i++){
        var L=cartaDe(s,parts[i]);
        var b = fmt==='docx' ? await docxBlob([L]) : await pdfBlob([L]);
        var n=nombreArchivo(s,parts[i],fmt==='docx'?'docx':'pdf',true);
        if(usados[n]){ n=n.replace(/(\.\w+)$/,'_'+(++usados[n])+'$1'); } else usados[n]=1;
        zip.file(n,b);
      }
      var zb=await zip.generateAsync({type:'blob'});
      saveBlob(zb,'Inv_'+cortoSim(s)+'_'+(fmt==='docx'?'Word':'PDF')+'.zip');
      toast('✅ ZIP con '+parts.length+' cartas descargado');
    }catch(e){ toast('⚠️ '+e.message); }
  }

  function leerSim(form, s){
    var fd=new FormData(form);
    function g(k){ return (fd.get(k)||'').toString().trim(); }
    s.nombre=g('nombre'); s.asunto=g('asunto'); s.tipo=g('tipo'); s.escenario=g('escenario'); s.plan=g('plan');
    s.municipio=g('municipio'); s.fecha=g('fecha'); s.horaIni=g('horaIni'); s.horaFin=g('horaFin'); s.fechaCarta=g('fechaCarta')||'la de la firma';
    return s;
  }

  function insertarEnParticipacion(txt){
    var ta=document.querySelector('#f-part textarea'); if(!ta) return;
    var pre=ta.value && !/\n$/.test(ta.value) ? '\n' : '';

  /* --- opciones marcables de la participación --- */
  var VINETA=/^\s*[-–•*]/;
  function normItem(t){ return norm(String(t).replace(/^\s*[-–•*]\s*/,'')).replace(/[.\s]+$/,'').trim(); }
  function partTieneItem(texto, item){
    return String(texto||'').split(/\r?\n/).some(function(l){ return VINETA.test(l) && normItem(l)===normItem(item); });
  }
  function partToggleItem(ta, item, on){
    var ls=String(ta.value).split(/\r?\n/).filter(function(l){ return l.trim(); });
    var idx=-1; ls.forEach(function(l,i){ if(idx<0 && VINETA.test(l) && normItem(l)===normItem(item)) idx=i; });
    if(on && idx<0){
      if(!ls.some(function(l){ return !VINETA.test(l); })) ls.unshift(INTRO_PART);   // sin frase previa: se añade
      ls.push('- '+item);
    }
    if(!on && idx>=0) ls.splice(idx,1);
    ta.value=ls.join('\n');
  }
  function opcionesPartHTML(texto){
    if(!state.opcionesPart.length) return '<span class="hint" style="margin:0">Aún no hay opciones. Añade la primera con «＋ Nueva opción».</span>';
    return state.opcionesPart.map(function(it,i){
      return '<label class="check"><input type="checkbox" data-opt="'+i+'"'+(partTieneItem(texto,it)?' checked':'')+'><span>'+esc(it)+'</span></label>';
    }).join('');
  }
  function chipsPlantillasHTML(){
    return state.plantillasPart.length ? state.plantillasPart.map(function(p,i){
      return '<button type="button" class="btn btn-sm" data-plantilla="'+i+'" title="'+esc(p.texto)+'">'+esc(p.nombre)+'</button>';
    }).join('') : '<span class="hint" style="margin:0">Sin plantillas todavía.</span>';
  }
  function sincronizarOpciones(){
    var ta=document.querySelector('#f-part textarea'); if(!ta) return;
    [].forEach.call(document.querySelectorAll('#f-part [data-opt]'), function(c){
      c.checked = partTieneItem(ta.value, state.opcionesPart[+c.getAttribute('data-opt')]);
    });
  }
  function refrescarOpcionesModal(){
    var ta=document.querySelector('#f-part textarea'); if(!ta) return;
    document.getElementById('listaOpciones').innerHTML=opcionesPartHTML(ta.value);
    document.getElementById('chipsPlantillas').innerHTML=chipsPlantillasHTML();
  }
  function usarPlantillaPart(i){
    var ta=document.querySelector('#f-part textarea'), p=state.plantillasPart[i]; if(!ta||!p) return;
    if(ta.value.trim() && ta.value.trim()!==p.texto.trim() && !window.confirm('Esto sustituye el texto actual por la plantilla «'+p.nombre+'». ¿Continuar?')) return;
    ta.value=p.texto; sincronizarOpciones();
  }
  function nuevaOpcionPart(){
    var t=(window.prompt('Nueva opción de participación (una línea, tal como saldrá en la lista):')||'').trim();
    if(!t) return;
    if(!state.opcionesPart.some(function(x){ return normItem(x)===normItem(t); })) state.opcionesPart.push(t);
    save();
    var ta=document.querySelector('#f-part textarea'); partToggleItem(ta, t, true);
    refrescarOpcionesModal();
  }
  function guardarPlantillaPart(){
    var ta=document.querySelector('#f-part textarea'); if(!ta || !ta.value.trim()){ toast('Escribe primero el texto'); return; }
    var n=(window.prompt('Nombre de la plantilla (p. ej. «Diputación» o «Ayuntamiento costero»):')||'').trim(); if(!n) return;
    var ex=state.plantillasPart.filter(function(p){ return p.nombre===n; })[0];
    if(ex){ if(!window.confirm('Ya existe una plantilla con ese nombre. ¿Sustituirla?')) return; ex.texto=ta.value.trim(); }
    else state.plantillasPart.push({nombre:n, texto:ta.value.trim()});
    // los elementos de la lista que aún no sean opciones marcables se añaden para futuros usos
    lines(ta.value).forEach(function(l){ if(VINETA.test(l)){ var it=l.replace(/^\s*[-–•*]\s*/,'').trim(); if(it && !state.opcionesPart.some(function(x){ return normItem(x)===normItem(it); })) state.opcionesPart.push(it); } });
    save(); refrescarOpcionesModal(); toast('Plantilla guardada');
  }

      var nombre=(fd.get('nombre')||'').toString().trim(); if(!nombre) return;
      var dest=(fd.get('destinatario')||'').toString();
      var partic=(fd.get('participacion')||'').toString().replace(/\s+$/,'');
      var corto=(fd.get('corto')||'').toString().trim();
      if(id){ o.nombre=nombre; o.destinatario=dest; o.participacion=partic; o.corto=corto; }
      else {
        var nuevo={id:uid('o'),nombre:nombre,destinatario:dest,participacion:partic,corto:corto};
        state.catalogo.push(nuevo);
        // Desde la pantalla de un simulacro, el nuevo destinatario queda ya invitado a él.
        var s=invitarEnSim ? sim(ui.simId) : null;
        if(s) s.participantes.push({opId:nuevo.id,estado:'Pendiente',fechaEnvio:null});
      }
      persist(id ? 'Operativo guardado' : 'Destinatario añadido al catálogo'+(invitarEnSim?' y a este simulacro':'')); closeModal(); rerender();
    });
  }
  function openEditarMembrete(){
    var m=state.membrete;
    openModal('<h2>Membrete y firma</h2><form id="f-mem">' +
      '<div class="field"><label>Cabecera (una línea por renglón)</label><textarea name="cabecera" rows="2">'+esc((m.cabecera||[]).join('\n'))+'</textarea></div>' +
      '<div class="field-row"><div class="field"><label>Cargo firmante</label><input name="firmaCargo" value="'+esc(m.firmaCargo)+'"></div>' +
      '<div class="field"><label>Firma (Fdo.: …)</label><input name="firmaNombre" value="'+esc(m.firmaNombre)+'" placeholder="Fdo.: Nombre Apellidos"></div></div>' +
      '<div class="field"><label>Pie de página (una línea por renglón)</label><textarea name="pie" rows="3">'+esc((m.pie||[]).join('\n'))+'</textarea></div>' +
      '<div class="field-row"><div class="field"><label>Logotipo (PNG/JPG)</label><input type="file" name="logo" accept="image/png,image/jpeg"></div>' +
      '<div class="field"><label>Sello del pie (PNG/JPG)</label><input type="file" name="sello" accept="image/png,image/jpeg"></div></div>' +
      '<p class="hint">Si no eliges imagen nueva se conserva la actual.</p>' +
      '<div class="modal-actions"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div></form>');
    document.getElementById('f-mem').addEventListener('submit', async function(e){
      e.preventDefault(); var fd=new FormData(e.target);
      function rd(f){ return new Promise(function(res){ if(!f||!f.size) return res(null); var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=function(){res(null);}; r.readAsDataURL(f); }); }
      var lg=await rd(fd.get('logo')), sl=await rd(fd.get('sello'));
      m.cabecera=lines(fd.get('cabecera')); m.firmaCargo=(fd.get('firmaCargo')||'').toString().trim();
      m.firmaNombre=(fd.get('firmaNombre')||'').toString().trim(); m.pie=lines(fd.get('pie'));
      if(lg) m.logo=lg; if(sl) m.sello=sl;
      persist('Membrete guardado'); closeModal(); rerender();
    });
  }
  function openEditarPlantilla(){
    var t=state.plantilla;
    openModal('<h2>Texto base de las cartas</h2><form id="f-pl">' +
      '<div class="field"><label>Párrafo 1</label><textarea name="p1" rows="5">'+esc(t.p1)+'</textarea></div>' +
      '<div class="field"><label>Párrafo 2</label><textarea name="p2" rows="6">'+esc(t.p2)+'</textarea></div>' +
      '<div class="field"><label>Despedida</label><textarea name="p3" rows="2">'+esc(t.p3)+'</textarea></div>' +
      '<div class="field"><label>Frase del borrador y anexo</label><textarea name="borrador" rows="2">'+esc(t.borrador)+'</textarea></div>' +
      '<p class="hint">Solo afecta a los simulacros que crees a partir de ahora.</p>' +
      '<div class="modal-actions"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div></form>', true);
    document.getElementById('f-pl').addEventListener('submit', function(e){
      e.preventDefault(); var fd=new FormData(e.target);
      ['p1','p2','p3','borrador'].forEach(function(k){ t[k]=(fd.get(k)||'').toString(); });
      persist('Texto base guardado'); closeModal(); rerender();
    });
  }

  /* ================= acciones ================= */
  function toggleOp(opId, on){
    var s=sim(ui.simId); if(!s) return;
    s.participantes = s.participantes.filter(function(p){return p.opId!==opId;});
    if(on) s.participantes.push({opId:opId, estado:'Pendiente', fechaEnvio:null});
    persist(); rerender();
  }
  function setEstado(opId, estado){
    var s=sim(ui.simId); if(!s) return;
    var p=s.participantes.filter(function(x){return x.opId===opId;})[0]; if(!p) return;
    p.estado=estado; p.fechaEnvio = (estado==='Enviada'||estado==='Confirmada') ? (p.fechaEnvio||todayISO()) : null;
    persist(); rerender();
  }
  function duplicarSim(){
    var s=sim(ui.simId); if(!s) return;
    var c=JSON.parse(JSON.stringify(s));
    c.id=uid('s'); c.nombre=s.nombre+' (copia)'; c.fecha=''; c.creado=Date.now();
    c.participantes=c.participantes.map(function(p){ return {opId:p.opId, estado:'Pendiente', fechaEnvio:null}; });
    state.simulacros.push(c); persist('Duplicado — pon la nueva fecha en «Editar datos»');
    ui.simId=c.id; render();
  }
  function eliminarSim(){
    var s=sim(ui.simId); if(!s) return;
    if(!window.confirm('¿Eliminar el simulacro "'+s.nombre+'"? No se puede deshacer.')) return;
    state.simulacros=state.simulacros.filter(function(x){return x.id!==s.id;});
    persist('Simulacro eliminado'); ui.view='home'; ui.simId=null; render();
  }
  function eliminarOp(id){
    var o=op(id); if(!o) return;
    if(!window.confirm('¿Quitar "'+o.nombre+'" del catálogo? También se quitará de los simulacros donde esté invitado.')) return;
    state.catalogo=state.catalogo.filter(function(x){return x.id!==id;});
    state.simulacros.forEach(function(s){ s.participantes=s.participantes.filter(function(p){return p.opId!==id;}); });
    persist('Operativo eliminado'); rerender();
  }
  function exportar(){
    var blob=new Blob([JSON.stringify({version:1, exportado:new Date().toISOString(), membrete:state.membrete, plantilla:state.plantilla, catalogo:state.catalogo, opcionesPart:state.opcionesPart, plantillasPart:state.plantillasPart, simulacros:state.simulacros}, null, 2)],{type:'application/json'});
    saveBlob(blob,'simulacros_datos_'+todayISO()+'.json'); toast('✅ Copia exportada (guárdala en un sitio privado)');
  }
  function importar(file){
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(d.membrete){ Object.keys(d.membrete).forEach(function(k){ var v=d.membrete[k]; if(v!==undefined && v!=='' && !(Array.isArray(v)&&!v.length)) state.membrete[k]=v; }); }
        if(d.plantilla) state.plantilla=Object.assign(state.plantilla,d.plantilla);
        // opciones y plantillas de participación: se suman las que falten, sin borrar las existentes
        if(Array.isArray(d.opcionesPart)) d.opcionesPart.forEach(function(x){ if(!state.opcionesPart.some(function(y){ return normItem(y)===normItem(x); })) state.opcionesPart.push(x); });
        if(Array.isArray(d.plantillasPart)) d.plantillasPart.forEach(function(p){ var ex=state.plantillasPart.filter(function(q){ return q.nombre===p.nombre; })[0]; if(ex) ex.texto=p.texto; else state.plantillasPart.push(p); });
        if(Array.isArray(d.catalogo)) d.catalogo.forEach(function(o){
          var ex=op(o.id); if(ex){ ex.nombre=o.nombre||ex.nombre; if(o.destinatario) ex.destinatario=o.destinatario; if(o.participacion) ex.participacion=o.participacion; if(o.corto) ex.corto=o.corto; } else state.catalogo.push({id:o.id||uid('o'),nombre:o.nombre,destinatario:o.destinatario||'',participacion:o.participacion||'',corto:o.corto||''});
        });
        var nuevos=0;
        if(Array.isArray(d.simulacros)) d.simulacros.forEach(function(s){ if(!sim(s.id)){ state.simulacros.push(s); nuevos++; } });
        persist('✅ Importado ('+nuevos+' simulacro'+(nuevos===1?'':'s')+' nuevo'+(nuevos===1?'':'s')+')'); rerender();
      }catch(e){ toast('⚠️ El fichero no es válido'); }
    };
    r.readAsText(file);
  }

  /* ================= eventos ================= */
  function onClick(ev){
    var t;
    if((t=ev.target.closest('[data-close]'))){ closeModal(); return; }
    if((t=ev.target.closest('[data-go]'))){ ui.view=t.getAttribute('data-go'); if(ui.view==='home') ui.simId=null; render(); return; }
    if((t=ev.target.closest('[data-new-sim]'))){ openNuevoSim(); return; }
    if((t=ev.target.closest('[data-open]'))){ ui.view='sim'; ui.simId=t.getAttribute('data-open'); render(); return; }
    if((t=ev.target.closest('[data-edit-sim]'))){ openEditarSim(); return; }
    if((t=ev.target.closest('[data-edit-texto]'))){ openEditarTexto(); return; }
    if((t=ev.target.closest('[data-edit-firma]'))){ openEditarFirma(); return; }
    if((t=ev.target.closest('[data-edit-part]'))){ openEditarParticipacion(t.getAttribute('data-edit-part')); return; }
    if((t=ev.target.closest('[data-ins-part]'))){ insertarEnParticipacion(t.getAttribute('data-ins-part')); return; }
    if((t=ev.target.closest('[data-plantilla]'))){ usarPlantillaPart(+t.getAttribute('data-plantilla')); return; }
    if((t=ev.target.closest('[data-nueva-opcion]'))){ nuevaOpcionPart(); return; }
    if((t=ev.target.closest('[data-guardar-plantilla]'))){ guardarPlantillaPart(); return; }
    if((t=ev.target.closest('[data-dup-sim]'))){ duplicarSim(); return; }
    if((t=ev.target.closest('[data-del-sim]'))){ eliminarSim(); return; }
    if((t=ev.target.closest('[data-sel-all]'))){ var s=sim(ui.simId); state.catalogo.forEach(function(o){ if(filaVisible(o) && !s.participantes.some(function(p){return p.opId===o.id;})) s.participantes.push({opId:o.id,estado:'Pendiente',fechaEnvio:null}); }); persist(); rerender(); return; }
    if((t=ev.target.closest('[data-sel-none]'))){ var s2=sim(ui.simId); s2.participantes=s2.participantes.filter(function(p){ var o=op(p.opId); return !(o && filaVisible(o)); }); persist(); rerender(); return; }
    if((t=ev.target.closest('[data-preview]'))){ openVistaPrevia(t.getAttribute('data-preview')); return; }
    if((t=ev.target.closest('[data-dl]'))){ var a=t.getAttribute('data-dl').split('|'); closeModal(); descargarUna(ui.simId,a[1],a[0]); return; }
    if((t=ev.target.closest('[data-dl-all]'))){ descargarTodas(ui.simId,t.getAttribute('data-dl-all')); return; }
    if((t=ev.target.closest('[data-edit-op]'))){ openEditarOp(t.getAttribute('data-edit-op')); return; }
    if((t=ev.target.closest('[data-new-op]'))){ openEditarOp(null); return; }
    if((t=ev.target.closest('[data-new-op-sim]'))){ openEditarOp(null, true); return; }
    if((t=ev.target.closest('[data-del-op]'))){ eliminarOp(t.getAttribute('data-del-op')); return; }
    if((t=ev.target.closest('[data-edit-membrete]'))){ openEditarMembrete(); return; }
    if((t=ev.target.closest('[data-edit-plantilla]'))){ openEditarPlantilla(); return; }
    if((t=ev.target.closest('[data-export]'))){ exportar(); return; }
    if((t=ev.target.closest('[data-import]'))){ document.getElementById('fileImport').click(); return; }
  }
  document.getElementById('app-root').addEventListener('click', onClick);
  document.getElementById('app-root').addEventListener('change', function(ev){
    var t;
    if((t=ev.target.closest('[data-toggle-op]'))){ toggleOp(t.getAttribute('data-toggle-op'), t.checked); return; }
    if((t=ev.target.closest('[data-estado-op]'))){ setEstado(t.getAttribute('data-estado-op'), t.value); return; }
    if(ev.target.id==='fileImport' && ev.target.files[0]){ importar(ev.target.files[0]); ev.target.value=''; }
    if(ev.target.id==='grupoOps'){ ui.grupo=ev.target.value; aplicarFiltroFilas(); return; }
  });
  document.getElementById('app-root').addEventListener('input', function(ev){
    if(ev.target.id==='buscarOps'){ ui.buscar=ev.target.value; aplicarFiltroFilas(); }
    if(ev.target.id==='buscarCat'){ ui.buscarCat=ev.target.value; aplicarFiltroCat(); }
  });

  render();
})();
</script>
</body>
</html>
