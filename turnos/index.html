<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guardia 112</title>
<script type="module" src="../shared/firebase-sync.js"></script>
<style id="app-style">
  :root{
    --ink:#101820;
    --ink-soft:#4b5560;
    --ink-faint:#7c8792;
    --paper:#eef2f1;
    --surface:#ffffff;
    --surface-alt:#f5f8f7;
    --border:#d8dfdc;
    --accent:#1f6f78;
    --accent-strong:#144c53;
    --accent-soft:#dbedec;
    --danger:#c8402f;
    --danger-soft:#f8e0db;
    --st-none:#8a94a3;      --st-none-soft:#eceff2;
    --st-slate:#5b5fc7;     --st-slate-soft:#e7e7f8;
    --st-amber:#c9820a;     --st-amber-soft:#faedd0;
    --st-blue:#2f6fed;      --st-blue-soft:#e2ebfd;
    --st-violet:#8b3fd1;    --st-violet-soft:#f1e3fa;
    --st-green:#1f9d55;     --st-green-soft:#dff5e6;
    --font-ui: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --shadow: 0 1px 2px rgba(16,24,32,.05), 0 6px 16px rgba(16,24,32,.06);
    --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --radius-pill:999px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef3f2; --ink-soft:#b7c2c6; --ink-faint:#8892988a;
      --paper:#0b1215; --surface:#131c20; --surface-alt:#182226;
      --border:#263133; --accent:#4fb3ac; --accent-strong:#7dd3cb; --accent-soft:#173634;
      --danger:#e8695a; --danger-soft:#3a1f1c;
      --st-none:#8f9aa3; --st-none-soft:#1c2529;
      --st-slate:#9a9df0; --st-slate-soft:#20223a;
      --st-amber:#e3a83c; --st-amber-soft:#3a2c12;
      --st-blue:#6f9bf5; --st-blue-soft:#182b47;
      --st-violet:#bd85ea; --st-violet-soft:#2c1f3a;
      --st-green:#5cc98a; --st-green-soft:#153524;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    }

    --ink:#eef3f2; --ink-soft:#b7c2c6; --ink-faint:#88929888;
    --paper:#0b1215; --surface:#131c20; --surface-alt:#182226;
    --border:#263133; --accent:#4fb3ac; --accent-strong:#7dd3cb; --accent-soft:#173634;
    --danger:#e8695a; --danger-soft:#3a1f1c;
    --st-none:#8f9aa3; --st-none-soft:#1c2529;
    --st-slate:#9a9df0; --st-slate-soft:#20223a;
    --st-amber:#e3a83c; --st-amber-soft:#3a2c12;
    --st-blue:#6f9bf5; --st-blue-soft:#182b47;
    --st-violet:#bd85ea; --st-violet-soft:#2c1f3a;
    --st-green:#5cc98a; --st-green-soft:#153524;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app-root{max-width:640px;margin:0 auto;padding:0 0 96px;min-height:100vh;}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  a{color:var(--accent);}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--border);
    padding:14px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand-mark{font-size:1.15rem;}
  .brand h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:-.01em;}

  .persona-chip{

    border-radius:var(--radius-pill);padding:5px 12px 5px 6px;
    cursor:pointer; box-shadow:var(--shadow); font-size:.82rem; font-weight:600;
    color:var(--ink); max-width:180px;
  }
  .persona-chip .av{
    width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);
    display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;flex:none;
  }
  .persona-chip span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .status-strip{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;}
  .status-strip::-webkit-scrollbar{display:none;}
  .status-mini{
    flex:none;display:flex;flex-direction:column;gap:3px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:8px 10px;min-width:118px;
  }
  .status-mini .who{font-size:.72rem;font-weight:700;color:var(--ink-soft);}
  .status-mini .pill{align-self:flex-start;}
  .status-mini .when{font-family:var(--font-mono);font-size:.66rem;color:var(--ink-faint);}

  main{padding:16px;}
  .section-title{
    display:flex;align-items:center;justify-content:space-between;
    margin:22px 0 10px;
  }
  .section-title:first-child{margin-top:4px;}
  .section-title h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:0;font-weight:700;}
  .section-title .count{font-family:var(--font-mono);color:var(--ink-faint);font-size:.72rem;}

  .card-list{display:flex;flex-direction:column;gap:10px;}
  .emg-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:14px 14px 12px;box-shadow:var(--shadow);cursor:pointer;
    display:flex;flex-direction:column;gap:8px;
  }
  .emg-card:hover{border-color:var(--accent);}
  .emg-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .emg-name{font-weight:700;font-size:1.02rem;letter-spacing:-.005em;}
  .emg-meta{color:var(--ink-soft);font-size:.82rem;display:flex;flex-wrap:wrap;gap:10px;}
  .emg-meta span{display:inline-flex;align-items:center;gap:4px;}
  .emg-people{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;

  .badge-activa{background:var(--danger-soft);color:var(--danger);}
  .badge-cerrada{background:var(--st-none-soft);color:var(--st-none);}
  .badge-alta{background:var(--danger-soft);color:var(--danger);}
  .badge-media{background:var(--st-amber-soft);color:var(--st-amber);}
  .badge-baja{background:var(--st-none-soft);color:var(--ink-soft);}

  .pill-none{background:var(--st-none-soft);color:var(--st-none);}

  .pill-en_ruta{background:var(--st-amber-soft);color:var(--st-amber);}
  .pill-llegada_pma{background:var(--st-blue-soft);color:var(--st-blue);}
  .pill-salida_pma{background:var(--st-violet-soft);color:var(--st-violet);}
  .pill-llegada_casa{background:var(--st-green-soft);color:var(--st-green);}
  .pill-guardia{background:var(--st-amber-soft);color:var(--st-amber);font-weight:700;}

    text-align:center;color:var(--ink-faint);padding:34px 18px;border:1px dashed var(--border);
    border-radius:var(--radius-lg);font-size:.88rem;

    position:fixed;right:18px;bottom:24px;z-index:30;
    background:var(--accent);color:#fff;border:none;border-radius:var(--radius-pill);
    padding:13px 20px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;gap:8px;

  .fab:hover{background:var(--accent-strong);}

    border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);
    color:var(--ink);font-weight:600;font-size:.85rem;padding:9px 14px;cursor:pointer;
  }
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .btn-danger{background:var(--surface);border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-sm{padding:6px 10px;font-size:.76rem;border-radius:var(--radius-sm);}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn-icon{border-radius:50%;width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;}

    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);

  .detail-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .detail-title{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;margin:2px 0 4px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:.82rem;}
  .detail-grid .k{color:var(--ink-faint);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
  .detail-grid .v{color:var(--ink);font-weight:600;}
  .detail-desc{margin-top:10px;font-size:.86rem;color:var(--ink-soft);line-height:1.45;}
  .detail-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

  .tabs{display:flex;gap:4px;margin:14px 0 4px;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-pill);padding:4px;}
  .tab{flex:1;text-align:center;padding:8px 6px;border-radius:var(--radius-pill);font-size:.78rem;font-weight:700;cursor:pointer;color:var(--ink-soft);}
  .tab.active{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow);}

  .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .status-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;}
  .status-card .who{font-weight:700;font-size:.86rem;}
  .status-card .role{color:var(--ink-faint);font-size:.7rem;margin-bottom:6px;}
  .status-card .when{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);margin-top:5px;}

  .log-list{display:flex;flex-direction:column;gap:0;margin-top:10px;border-top:1px solid var(--border);}
  .log-item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border);font-size:.84rem;}
  .log-item .av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;flex:none;}
  .log-item .main{flex:1;min-width:0;}
  .log-item .lbl{font-weight:600;}
  .log-item .sub{color:var(--ink-faint);font-size:.74rem;}
  .log-item .ts{font-family:var(--font-mono);font-size:.76rem;color:var(--ink-soft);flex:none;text-align:right;}

  .stage-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-top:12px;box-shadow:var(--shadow);}
  .stage-panel h3{margin:0 0 3px;font-size:.85rem;}
  .stage-panel .cur{color:var(--ink-soft);font-size:.78rem;margin-bottom:10px;}
  .stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stage-btn{
    border-radius:var(--radius-md);border:1.5px solid var(--border);background:var(--surface-alt);
    padding:10px 8px;font-weight:700;font-size:.78rem;cursor:pointer;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
  }
  .stage-btn .ic{font-size:1.05rem;}
  .stage-btn.reco{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);}
  .stage-btn:active{transform:scale(.97);}

  .plan-toolbar{display:flex;justify-content:flex-end;margin-top:12px;}
  .day-block{margin-top:16px;}
  .day-title{font-family:var(--font-mono);font-size:.76rem;color:var(--ink-soft);font-weight:700;margin-bottom:8px;}
  .timeline{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px 6px;}
  .tl-scale{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.6rem;color:var(--ink-faint);margin-bottom:6px;padding-left:70px;}
  .tl-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .tl-label{width:62px;flex:none;font-size:.68rem;font-weight:700;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tl-track{position:relative;flex:1;height:20px;background:var(--surface-alt);border-radius:6px;}
  .tl-bar{position:absolute;top:2px;bottom:2px;border-radius:5px;font-size:.6rem;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;padding:0 3px;font-weight:700;}

  .turno-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .turno-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:.8rem;}
  .turno-row .who{font-weight:700;width:78px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .turno-row .hrs{font-family:var(--font-mono);color:var(--ink-soft);flex:none;}
  .turno-row .nota{flex:1;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .relevo-chip{align-self:center;font-size:.66rem;color:var(--accent-strong);background:var(--accent-soft);border-radius:var(--radius-pill);padding:2px 9px;font-weight:700;margin:-2px 0 0;}

  .cal-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:8px;margin-top:12px;}
  .cal-table{border-collapse:collapse;width:100%;min-width:480px;}
  .cal-table th, .cal-table td{padding:5px;vertical-align:top;}
  .cal-table thead th{font-size:.64rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;border-bottom:1px solid var(--border);text-align:center;}
  .cal-corner{width:60px;}
  .cal-rowhead{text-align:left;font-size:.74rem;font-weight:700;color:var(--ink-soft);white-space:nowrap;border-right:1px solid var(--border);padding-right:8px;}
  .cal-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-width:92px;text-align:center;}
  .cal-cell:last-child{border-right:none;}
  .cal-table tbody tr:last-child .cal-cell{border-bottom:none;}
  .cal-chip{display:block;width:100%;margin-bottom:3px;border:none;border-radius:6px;padding:4px 5px;font-size:.66rem;font-weight:700;font-family:var(--font-mono);cursor:pointer;}
  .cal-chip-descanso{background:var(--st-none-soft);color:var(--st-none);font-family:var(--font-ui);}
  .cal-chip-guardia{background:var(--st-amber-soft);color:var(--st-amber);font-family:var(--font-ui);}
  .cal-add{width:100%;border:1px dashed var(--border);background:transparent;border-radius:6px;color:var(--ink-faint);font-size:.8rem;padding:3px;cursor:pointer;line-height:1.2;}
  .cal-add:hover{border-color:var(--accent);color:var(--accent);}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,14,17,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;}
  @media (min-width:560px){.modal-overlay{align-items:center;padding:20px;}}
  .modal{
    background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:18px 18px 22px;box-shadow:var(--shadow);
  }
  @media (min-width:560px){.modal{border-radius:var(--radius-lg);}}
  .modal h2{margin:0 0 14px;font-size:1.05rem;}
  .field{margin-bottom:12px;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:.72rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .field input, .field select, .field textarea{
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;font-size:.9rem;
    background:var(--surface-alt);color:var(--ink);width:100%;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-alt);font-weight:600;font-size:.82rem;cursor:pointer;color:var(--ink);}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions .btn{flex:1;}

  .onboard{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px;gap:18px;}
  .onboard h1{font-size:1.3rem;margin:0;}
  .onboard p{color:var(--ink-soft);margin:0;font-size:.88rem;}
  .who-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .who-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:16px 10px;text-align:center;cursor:pointer;box-shadow:var(--shadow);}
  .who-card:hover{border-color:var(--accent);}
  .who-card .av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:800;margin:0 auto 8px;}
  .who-card .nm{font-weight:700;font-size:.86rem;}
  .who-card .rl{font-size:.7rem;color:var(--ink-faint);margin-top:2px;}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:var(--radius-pill);font-size:.82rem;font-weight:600;box-shadow:var(--shadow);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .banner{display:flex;align-items:center;gap:8px;background:var(--st-amber-soft);color:var(--st-amber);border-radius:var(--radius-md);padding:9px 12px;font-size:.78rem;font-weight:600;margin-bottom:12px;}
  .hint{font-size:.72rem;color:var(--ink-faint);margin-top:10px;line-height:1.5;}
  .link-row{display:flex;align-items:center;gap:8px;color:var(--ink-soft);}
</style>

  /* ---------- sincronización en la nube (Firebase, opcional) ----------
     No es un requisito para usar la app: por defecto todo sigue funcionando
     solo con localStorage, igual que antes. Si Kiko inicia sesión (botón ☁️),
     además se guarda en la nube y se sincroniza entre dispositivos. Así un
     fallo de red o de Firebase nunca deja la app inutilizable. */
  var authUser = null;
  var cloudWatchStarted = false;
  var CLOUD_PATH = 'turnos/state';

  window.onPortalAuthReady = function(user){
    var wasLoggedIn = !!authUser;
    authUser = user;
    if(user && !wasLoggedIn){ hydrateFromCloud(); cargarGuardiaData(); }
    if(!user){ GUARDIA_DATA = null; if(ui.view==='guardia') goHome(); }
    render();
  };

  function hydrateFromCloud(){
    if(!window.PortalSync) return;
    window.PortalSync.loadData(CLOUD_PATH).then(function(remote){
      if(remote){
        state = remote;
        saveState();
        render();
      } else {
        // primera vez que se conecta este dispositivo: sube el estado local actual como semilla
        window.PortalSync.saveData(CLOUD_PATH, state).catch(function(){});
      }
      startCloudWatch();
    }).catch(function(){ /* sin conexión o similar: se sigue trabajando en local */ });
  }

  function startCloudWatch(){
    if(cloudWatchStarted || !window.PortalSync) return;
    cloudWatchStarted = true;
    window.PortalSync.watchData(CLOUD_PATH, function(remote){
      if(!remote) return;
      // evita repintar si es el eco de nuestro propio guardado
      if(JSON.stringify(remote) === JSON.stringify(state)) return;
      state = remote;
      saveState();
      render();
      toast('☁️ Cuadrante actualizado desde otro dispositivo');
    });
  }

  function openLoginModal(){
    openModal(
      '<h2>☁️ Sincronizar con la nube</h2>' +
      '<p class="hint" style="margin-top:0;">Inicia sesión para que el cuadrante se guarde también en la nube y puedas verlo desde cualquier dispositivo. Se queda recordado en este navegador.</p>' +
      '<form id="f-login">' +
        '<div class="field"><label>Email</label><input type="email" name="email" required autocomplete="username" autofocus></div>' +
        '<div class="field"><label>Contraseña</label><input type="password" name="password" required autocomplete="current-password"></div>' +
        '<div id="login-error" style="color:var(--danger);font-size:.8rem;min-height:1.1em;"></div>' +
        '<div class="modal-actions"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn btn-primary">Entrar</button></div>' +
      '</form>'
    );
    var form = document.getElementById('f-login');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var errEl = document.getElementById('login-error');
      if(!window.PortalSync){ errEl.textContent = 'No se pudo cargar la sincronización (revisa tu conexión y recarga).'; return; }
      var fd = new FormData(form);
      var email = (fd.get('email')||'').toString().trim();
      var password = (fd.get('password')||'').toString();
      var btn = form.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Entrando…';
      window.PortalSync.login(email, password).then(function(){
        closeModal();
        toast('☁️ Sesión iniciada — sincronizando…');
      }).catch(function(){
        errEl.textContent = 'Email o contraseña incorrectos.';
        btn.disabled = false; btn.textContent = 'Entrar';
      });
    });
  }

  function toggleCloudSync(){
    if(authUser){
      if(window.confirm('¿Cerrar la sesión de sincronización en este dispositivo?') && window.PortalSync) window.PortalSync.logout();
    } else {
      openLoginModal();
    }
  }

  function cloudChip(){
    if(authUser){
      return '<button type="button" class="btn btn-ghost btn-sm" data-cloud-toggle title="Sincronizado con la nube · pulsa para cerrar sesión">☁️</button>';
    }
    return '<button type="button" class="btn btn-ghost btn-sm" data-cloud-toggle title="Sin sincronizar con la nube · pulsa para conectar">☁️ Conectar</button>';
  }

  var TIPOS = ['Incendio','Accidente de tráfico','Inundación','Rescate acuático','Rescate en altura/confinado','Sanitario','Búsqueda de persona','Riesgo químico','Otro'];
  var PRIORIDADES = ['Alta','Media','Baja'];
  // STAGES = todos los tipos de fichaje que puede haber en el histórico (incluye "en_ruta",
  // heredado, ya solo por compatibilidad de datos antiguos). ACTIVE_STAGES = los que se
  // pueden fichar ahora: se quitó "En ruta" porque la Salida ya cuenta ese tramo.
  var STAGES = [
    {key:'salida_casa',   label:'Salida (casa)',    short:'Salida casa',   icon:'🏠', color:'slate'},
    {key:'salida_centro', label:'Salida (centro)',  short:'Salida centro', icon:'🏢', color:'slate'},
    {key:'en_ruta',       label:'En ruta',          short:'En ruta',       icon:'🚗', color:'amber'},
    {key:'llegada_pma',   label:'Llegada al PMA',   short:'Llegada PMA',   icon:'📍', color:'blue'},
    {key:'salida_pma',    label:'Salida del PMA',   short:'Salida PMA',    icon:'↩️', color:'violet'},
    {key:'llegada_casa',  label:'Llegada a casa',   short:'Llegada casa',  icon:'🏁', color:'green'}
  ];
  var ACTIVE_STAGES = STAGES.filter(function(s){ return s.key!=='en_ruta'; });
  var STAGE_CYCLE = 4;

  // ---------- Guardia del equipo (ATEM + Guardias) ----------
  // El cuadrante diario (nombres + TT/GL/G por dia, un ano entero) es informacion
  // real de personal, asi que NUNCA se guarda en este fichero publico. Vive en la
  // misma base de datos de Firebase que ya usa la sincronizacion en la nube, en una
  // ruta que solo se puede leer con sesion iniciada (reglas: auth != null). Sin
  // sesion, esta seccion simplemente no se carga ni se muestra.
  var GUARDIA_CODIGOS = { juan:['TT','GL'], fernando:['TT','GL'], ana:['G'], kiko:['G'] };
  var GUARDIA_PATH = 'guardia/2026';
  var GUARDIA_DATA = null;      // null = todavia no cargada
  var guardiaCargando = false;

  function isoFromDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function lunesDeSemana(iso){
    var d = new Date(iso+'T00:00:00');
    var offset = (d.getDay()+6)%7; // lunes=0 ... domingo=6
    d.setDate(d.getDate()-offset);
    return d;
  }
  function codigoGuardia(personaId, iso){
    if(!GUARDIA_DATA) return null;
    var dia = GUARDIA_DATA[personaId];
    return dia ? (dia[iso]||null) : null;
  }
  function esDeGuardia(personaId, iso){
    var codigo = codigoGuardia(personaId, iso);
    var codigos = GUARDIA_CODIGOS[personaId] || [];
    return (codigo && codigos.indexOf(codigo)!==-1) ? codigo : null;
  }
  function cargarGuardiaData(){
    if(GUARDIA_DATA || guardiaCargando || !window.PortalSync || !authUser) return;
    guardiaCargando = true;
    window.PortalSync.loadData(GUARDIA_PATH).then(function(remote){
      guardiaCargando = false;
      GUARDIA_DATA = remote || {};
      if(ui.view==='home' || ui.view==='guardia') render();
    }).catch(function(){ guardiaCargando = false; });
  }

  function stageMeta(key){ for(var i=0;i<STAGES.length;i++){ if(STAGES[i].key===key) return STAGES[i]; } return null; }
  function stageOrderIndex(key){
    // "en_ruta" es un dato heredado: cuenta como el mismo paso que "salida",
    // para que el siguiente paso recomendado tras un fichaje antiguo siga siendo correcto.
    if(key==='salida_casa'||key==='salida_centro'||key==='en_ruta') return 0;
    if(key==='llegada_pma') return 1;
    if(key==='salida_pma') return 2;
    if(key==='llegada_casa') return 3;
    return -1;
  }

  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pad2(n){ return (n<10?'0':'')+n; }
  function fmtTime(ts){ var d=new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
  function fmtDateShort(ts){ var d=new Date(ts); return pad2(d.getDate())+'/'+pad2(d.getMonth()+1); }
  function fmtDateTime(ts){ return fmtDateShort(ts)+' · '+fmtTime(ts); }
  function fmtElapsed(ts){
    var diff = Date.now()-ts;
    var m = Math.round(diff/60000);
    if(m<1) return 'ahora';
    if(m<60) return 'hace '+m+'m';
    var h = Math.floor(m/60), rm = m%60;
    if(h<24) return 'hace '+h+'h'+(rm?' '+rm+'m':'');
    return fmtDateTime(ts);
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function nowHM(){ var d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
  function minutesOf(hm){ var p=hm.split(':'); return (+p[0])*60+(+p[1]); }
  function fmtFechaLarga(iso){
    var meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    var p=iso.split('-'); return (+p[2])+' '+meses[(+p[1])-1];
  }

  function persona(id){ for(var i=0;i<state.personas.length;i++){ if(state.personas[i].id===id) return state.personas[i]; } return null; }
  function emergencia(id){ for(var i=0;i<state.emergencias.length;i++){ if(state.emergencias[i].id===id) return state.emergencias[i]; } return null; }

  function lastFichaje(emg, personaId){
    var best=null;
    for(var i=0;i<emg.fichajes.length;i++){
      var f=emg.fichajes[i];
      if(f.personaId===personaId && (!best || f.ts>best.ts)) best=f;
    }
    return best;
  }
  function lastFichajeGlobal(personaId){
    var best=null;
    for(var i=0;i<state.emergencias.length;i++){
      var emg=state.emergencias[i];
      var f=lastFichaje(emg, personaId);
      if(f && (!best || f.ts>best.f.ts)) best={f:f, emg:emg};
    }
    return best;
  }

  /* ---------- horas trabajadas: agrupa cada fichajes en "episodios" salida→casa ---------- */
  function fmtDuration(ms){
    if(ms==null) return '—';
    var totalMin = Math.max(0, Math.round(ms/60000));
    var h = Math.floor(totalMin/60), m = totalMin%60;
    if(h<=0) return m+'m';
    return h+'h '+(m? pad2(m)+'m' : '');
  }
  function finalizeEpisodio(cur, llegadaCasaTs){
    var ida = cur.llegadaPmaTs!=null ? (cur.llegadaPmaTs - cur.salidaTs) : null;
    var pma = (cur.llegadaPmaTs!=null && cur.salidaPmaTs!=null) ? (cur.salidaPmaTs - cur.llegadaPmaTs) : null;
    var vuelta = (cur.salidaPmaTs!=null && llegadaCasaTs!=null) ? (llegadaCasaTs - cur.salidaPmaTs) : null;
    var total = llegadaCasaTs!=null ? (llegadaCasaTs - cur.salidaTs) : null;
    return {
      personaId: cur.personaId, emgId: cur.emgId, emgNombre: cur.emgNombre, origen: cur.origen,
      salidaTs: cur.salidaTs, llegadaPmaTs: cur.llegadaPmaTs, salidaPmaTs: cur.salidaPmaTs, llegadaCasaTs: llegadaCasaTs,
      ida: ida, pma: pma, vuelta: vuelta, total: total, completo: llegadaCasaTs!=null
    };
  }
  function episodiosPersonaEmg(emg, personaId){
    var events = emg.fichajes.filter(function(f){ return f.personaId===personaId && f.tipo!=='en_ruta'; })
      .slice().sort(function(a,b){ return a.ts-b.ts; });
    var episodios = [], cur = null;
    events.forEach(function(f){
      if(f.tipo==='salida_casa' || f.tipo==='salida_centro'){
        if(cur) episodios.push(finalizeEpisodio(cur, null));
        cur = { personaId: personaId, emgId: emg.id, emgNombre: emg.nombre, origen: f.tipo==='salida_casa'?'Casa':'Centro', salidaTs: f.ts, llegadaPmaTs: null, salidaPmaTs: null };
      } else if(f.tipo==='llegada_pma'){
        if(cur && cur.llegadaPmaTs==null) cur.llegadaPmaTs = f.ts;
      } else if(f.tipo==='salida_pma'){
        if(cur && cur.llegadaPmaTs!=null && cur.salidaPmaTs==null) cur.salidaPmaTs = f.ts;
      } else if(f.tipo==='llegada_casa'){
        if(cur){ episodios.push(finalizeEpisodio(cur, f.ts)); cur = null; }
      }
    });
    if(cur) episodios.push(finalizeEpisodio(cur, null));
    return episodios;
  }
  function episodiosFiltrados(emgId, personaId){
    var out = [];
    state.emergencias.forEach(function(emg){
      if(emgId!=='all' && emg.id!==emgId) return;
      state.personas.forEach(function(p){
        if(personaId!=='all' && p.id!==personaId) return;
        out = out.concat(episodiosPersonaEmg(emg, p.id));
      });
    });
    out.sort(function(a,b){ return b.salidaTs-a.salidaTs; });
    return out;
  }
  function totalParaTipo(episodios, tipo){
    var ms = 0;
    episodios.forEach(function(ep){
      if(tipo==='todo'){ if(ep.total!=null) ms += ep.total; }
      else if(tipo==='pma'){ if(ep.pma!=null) ms += ep.pma; }
      else if(tipo==='trayecto'){ if(ep.ida!=null) ms += ep.ida; if(ep.vuelta!=null) ms += ep.vuelta; }
    });
    return ms;
  }
  function episodioEnCursoDe(personaId){
    var eps = episodiosFiltrados('all', personaId).filter(function(e){ return !e.completo; });
    if(!eps.length) return null;
    eps.sort(function(a,b){ return b.salidaTs-a.salidaTs; });
    return eps[0];
  }
  function faseActual(ep){
    var now = Date.now();
    if(ep.salidaPmaTs!=null) return { key:'salida_pma', label:'Volviendo a casa', desde:ep.salidaPmaTs, dur: now-ep.salidaPmaTs };
    if(ep.llegadaPmaTs!=null) return { key:'llegada_pma', label:'En el PMA', desde:ep.llegadaPmaTs, dur: now-ep.llegadaPmaTs };
    return { key:'salida_casa', label:'En trayecto', desde:ep.salidaTs, dur: now-ep.salidaTs };
  }

  /* ---------- persistence: publish full page ---------- */
  function jsonForEmbed(obj){
    return JSON.stringify(obj).replace(/</g, '\\u003c');
  }
  function buildFullDocument(stateObj){
    var styleHTML = document.getElementById('app-style').outerHTML;
    var runtimeHTML = document.getElementById('app-runtime').outerHTML;
    var json = jsonForEmbed(stateObj);
    return '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
      '<title>Guardia 112</title>\n' + styleHTML + '\n</head>\n<body>\n' +
      '<script id="app-state" type="application/json">' + json + SC + '\n' +
      '<div id="app-root"></div>\n' + runtimeHTML + '\n</body>\n</html>';
  }

  function saveUi(){
    try{ sessionStorage.setItem('g112_ui', JSON.stringify({view:ui.view, emgId:ui.emgId, subtab:ui.subtab})); }catch(e){}
  }

  var pendingToast = null;
  function toast(msg){
    pendingToast = msg;
    var el = document.getElementById('g112-toast');
    if(!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  function commit(mutator, successMsg){
    // Fuente de verdad: localStorage, guardado de forma síncrona antes de repintar.
    // Así "eliminar de verdad" funciona siempre, incluso sin conexión a ninguna
    // capability externa (que era el motivo de que los cambios se perdieran al recargar).
    mutator(state);
    saveState();
    render();
    saveUi();
    if(successMsg) toast(successMsg);
    // Si hay sesión iniciada, se sube también a la nube (mejor esfuerzo: si falla
    // por falta de conexión, el cambio ya está a salvo en localStorage igualmente).
    if(authUser && window.PortalSync){
      window.PortalSync.saveData(CLOUD_PATH, state).catch(function(){
        toast('⚠️ Guardado en este dispositivo, pero no se pudo sincronizar con la nube');
      });
    }
    // Si además esta página corre como artefacto publicado de Claude, se intenta
    // sincronizar también ahí — pero nunca depende de ello para guardar.
    if(artifactCap && !readOnly){
      artifactCap.publish(buildFullDocument(state)).catch(function(err){
        var code = err && err.code;
        if(code==='not_writer' || code==='not_granted' || code==='not_declared' || code==='capability_disabled'){
          readOnly = true;
        }
      });
    }
  }

  /* ---------- init capability ---------- */
  function initCapability(){
    if(!window.claude || !window.claude.use) return;
    window.claude.use('artifact').then(function(cap){ artifactCap = cap || null; }).catch(function(){ artifactCap = null; });
    window.claude.use('downloads').then(function(cap){ downloadsCap = cap || null; }).catch(function(){ downloadsCap = null; });
  }

  /* ---------- navigation ---------- */
  function goHome(){ ui.view='home'; ui.emgId=null; saveUi(); render(); }
  function openEmg(id){ ui.view='detail'; ui.emgId=id; ui.subtab='resumen'; saveUi(); render(); }
  function openHoras(){ if(!isAdmin()) return; ui.view='horas'; saveUi(); render(); window.scrollTo(0,0); }
  function openGuardia(fecha){ ui.view='guardia'; ui.guardiaFecha = fecha || todayISO(); saveUi(); render(); window.scrollTo(0,0); }
  function setSubtab(t){ ui.subtab=t; saveUi(); render(); window.scrollTo(0,0); }

  /* ---------- modals ---------- */
  function openModal(html){
    closeModal();
    var wrap = document.createElement('div');
    wrap.className='modal-overlay'; wrap.id='g112-modal';
    wrap.innerHTML = '<div class="modal">'+html+'</div>';
    wrap.addEventListener('click', function(e){
      if(e.target===wrap){ closeModal(); return; }
      handleAppClick(e);
    });
    document.body.appendChild(wrap);
  }
  function closeModal(){ var m=document.getElementById('g112-modal'); if(m) m.remove(); }

  /* ---------- informe de horas (solo admin) ---------- */
  function csvField(v){
    v = String(v==null?'':v);
    if(/[;"\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  function buildHorasCSV(){
    var f = ui.horasFiltro;
    var episodios = episodiosFiltrados(f.emgId, f.personaId);
    var lines = [];
    lines.push(['Persona','Rol','Emergencia','Origen salida','Salida','Llegada PMA','Salida PMA','Llegada a casa','Trayecto (h)','PMA (h)','Total (h)','Estado'].map(csvField).join(';'));
    episodios.forEach(function(ep){
      var p = persona(ep.personaId);
      var trayectoMs = (ep.ida||0)+(ep.vuelta||0);
      var trayectoH = (ep.ida!=null||ep.vuelta!=null) ? (trayectoMs/3600000).toFixed(2) : '';
      var pmaH = ep.pma!=null ? (ep.pma/3600000).toFixed(2) : '';
      var totalH = ep.total!=null ? (ep.total/3600000).toFixed(2) : '';
      lines.push([
        p.nombre, p.rol, ep.emgNombre, ep.origen,
        fmtDateTime(ep.salidaTs),
        ep.llegadaPmaTs?fmtDateTime(ep.llegadaPmaTs):'',
        ep.salidaPmaTs?fmtDateTime(ep.salidaPmaTs):'',
        ep.llegadaCasaTs?fmtDateTime(ep.llegadaCasaTs):'',
        trayectoH, pmaH, totalH,
        ep.completo?'Completo':'En curso'
      ].map(csvField).join(';'));
    });
    lines.push('');
    var tipoLbl = f.tipo==='todo'?'Puerta a puerta':(f.tipo==='pma'?'Solo PMA':'Solo trayecto');
    lines.push(csvField('Resumen — '+tipoLbl));
    lines.push(['Persona','Horas'].map(csvField).join(';'));
    var personasToShow = f.personaId==='all' ? state.personas : [persona(f.personaId)];
    personasToShow.forEach(function(p){
      var epsP = episodios.filter(function(ep){ return ep.personaId===p.id; });
      var tot = totalParaTipo(epsP, f.tipo);
      lines.push([p.nombre, (tot/3600000).toFixed(2)].map(csvField).join(';'));
    });
    return '﻿' + lines.join('\r\n');
  }
  function buildHorasTSV(){
    // Igual que el CSV pero separado por tabuladores: al pegarlo directamente en Excel
    // o Google Sheets se reparte solo en columnas, sin pasar por "abrir archivo".
    var f = ui.horasFiltro;
    var episodios = episodiosFiltrados(f.emgId, f.personaId);
    var lines = [];
    lines.push(['Persona','Rol','Emergencia','Origen salida','Salida','Llegada PMA','Salida PMA','Llegada a casa','Trayecto (h)','PMA (h)','Total (h)','Estado'].join('\t'));
    episodios.forEach(function(ep){
      var p = persona(ep.personaId);
      var trayectoMs = (ep.ida||0)+(ep.vuelta||0);
      var trayectoH = (ep.ida!=null||ep.vuelta!=null) ? (trayectoMs/3600000).toFixed(2) : '';
      var pmaH = ep.pma!=null ? (ep.pma/3600000).toFixed(2) : '';
      var totalH = ep.total!=null ? (ep.total/3600000).toFixed(2) : '';
      lines.push([
        p.nombre, p.rol, ep.emgNombre, ep.origen,
        fmtDateTime(ep.salidaTs),
        ep.llegadaPmaTs?fmtDateTime(ep.llegadaPmaTs):'',
        ep.salidaPmaTs?fmtDateTime(ep.salidaPmaTs):'',
        ep.llegadaCasaTs?fmtDateTime(ep.llegadaCasaTs):'',
        trayectoH, pmaH, totalH,
        ep.completo?'Completo':'En curso'
      ].join('\t'));
    });
    return lines.join('\n');
  }
  function showTextModal(title, helpText, text){
    openModal(
      '<h2>'+esc(title)+'</h2>' +
      '<div class="field"><label>'+esc(helpText)+'</label>' +
      '<textarea id="text-copy-area" readonly style="min-height:180px;font-family:var(--font-mono);font-size:.7rem;">'+esc(text)+'</textarea></div>' +
      '<div class="modal-actions"><button type="button" class="btn btn-primary btn-block" data-close>Cerrar</button></div>'
    );
    var ta = document.getElementById('text-copy-area');
    if(ta){ ta.focus(); ta.select(); }
  }
  function copyHorasFallback(){
    var tsv = buildHorasTSV();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(tsv).then(function(){
        toast('Informe copiado — pégalo en Excel o Google Sheets');
      }).catch(function(){ showTextModal('Informe de horas', 'No se pudo copiar automáticamente — selecciona todo y copia', tsv); });
    } else {
      showTextModal('Informe de horas', 'Selecciona todo y copia', tsv);
    }
  }
  function downloadHoras(){
    if(!isAdmin()) return;
    if(!downloadsCap){ copyHorasFallback(); return; }
    var csv = buildHorasCSV();
    var base = 'horas_guardia112_' + todayISO();
    downloadsCap.save({ filename: base+'.csv', data: csv }).then(function(){
      toast('Informe descargado');
    }).catch(function(err){
      var code = err && err.code;
      if(code==='extension_not_enabled' || code==='rejected_extension'){
        downloadsCap.save({ filename: base+'.txt', data: csv }).then(function(){
          toast('Informe descargado (.txt)');
        }).catch(function(){ copyHorasFallback(); });
      } else if(code==='declined'){
        // el usuario canceló el diálogo de descarga; no hace falta avisar
      } else {
        copyHorasFallback();
      }
    });
  }

  function toggleCierre(emgId){
    if(!isAdmin()){ toast('Solo Kiko puede cerrar o reabrir emergencias.'); return; }
    var e2 = emergencia(emgId);
    var closing = e2.estado==='activa';

  function deleteEmergencia(emgId){
    if(!isAdmin()){ toast('Solo Kiko puede eliminar emergencias.'); return; }
    var emg = emergencia(emgId);
    if(!emg) return;
    var aviso = '¿Eliminar definitivamente "'+emg.nombre+'"?\n\nSe borrarán también todos sus turnos y fichajes ('+emg.fichajes.length+' fichajes, '+emg.turnos.length+' turnos). Esta acción no se puede deshacer.';

  function renderGuardia(){
    if(!authUser || !GUARDIA_DATA){
      return '<div class="topbar"><div class="back-row">' +
        '<button class="btn btn-ghost btn-sm" data-go-home>← Volver</button>' +
        '</div></div><main><div class="empty-state">🔒 Inicia sesión (☁️) para ver la guardia del equipo.</div></main>';
    }
    var fecha = ui.guardiaFecha || todayISO();
    var lunes = lunesDeSemana(fecha);
    var dias = [];
    for(var i=0;i<7;i++){ dias.push(isoFromDate(new Date(lunes.getTime() + i*86400000))); }
    var hoy = todayISO();

    var html = '<div class="topbar"><div class="back-row">' +
      '<button class="btn btn-ghost btn-sm" data-go-home>← Volver</button>' +
      '<div class="persona-chip" style="cursor:default;"><div class="av">🛡️</div><span class="name">Guardia del equipo</span></div>' +
      '</div></div>';

    html += '<main>';
    html += '<div class="section-title"><h2>Semana del '+fmtFechaLarga(dias[0])+'</h2></div>';
    html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;">' +
      '<button type="button" class="btn btn-sm" data-guardia-semana="-7">‹ Anterior</button>' +
      '<button type="button" class="btn btn-sm" data-guardia-hoy>Hoy</button>' +
      '<button type="button" class="btn btn-sm" data-guardia-semana="7">Siguiente ›</button>' +
      '<input type="date" data-guardia-fecha value="'+esc(fecha)+'" style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 9px;background:var(--surface-alt);color:var(--ink);font-size:.85rem;">' +
      '</div>';

    var headerCells = dias.map(function(d){
      return '<th style="padding:6px 8px;text-align:center;'+(d===hoy?'color:var(--accent-strong);':'')+'">'+fmtCalHeader(d)+'</th>';
    }).join('');
    var filas = state.personas.map(function(p){
      var celdas = dias.map(function(d){
        var codigo = codigoGuardia(p.id, d);
        var guardiaCodigo = esDeGuardia(p.id, d);
        var estilo = 'padding:6px 8px;text-align:center;border-radius:6px;';
        if(guardiaCodigo) estilo += 'background:var(--st-amber-soft);color:var(--st-amber);font-weight:700;';
        if(d===hoy) estilo += 'outline:1.5px solid var(--accent);outline-offset:-1.5px;';
        var contenido = guardiaCodigo ? ('🛡️ '+esc(guardiaCodigo)) :
          (codigo ? '<span style="color:var(--ink-faint);">'+esc(codigo)+'</span>' : '<span style="color:var(--ink-faint);">—</span>');
        return '<td style="'+estilo+'">'+contenido+'</td>';
      }).join('');
      return '<tr style="border-top:1px solid var(--border);"><td style="padding:6px 8px;font-weight:700;white-space:nowrap;">'+esc(p.nombre)+'</td>'+celdas+'</tr>';

  function colorForPersonaIndex(id){
    var idx = state.personas.map(function(p){return p.id;}).indexOf(id);

  function fmtCalHeader(iso){
    var d = new Date(iso+'T00:00:00');
    var dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    return dias[d.getDay()]+' '+d.getDate();
  }
  function calendarDates(emg){
    var start = new Date(emg.inicio);
    start.setHours(0,0,0,0);
    var days = Math.max(ui.calDays||4, 1);
    var maxOffset = days-1;
    emg.turnos.forEach(function(t){
      var d = new Date(t.fecha+'T00:00:00');
      var offset = Math.round((d - start)/86400000);
      if(offset > maxOffset) maxOffset = offset;
    });
    var out = [];
    for(var i=0;i<=maxOffset;i++){
      var d2 = new Date(start.getTime() + i*86400000);
      out.push(d2.getFullYear()+'-'+pad2(d2.getMonth()+1)+'-'+pad2(d2.getDate()));
    }
    return out;
  }
  function detectRelevos(emg, dates){
    var out = [];
    dates.forEach(function(d){
      var turnosDia = emg.turnos.filter(function(t){ return t.fecha===d && (t.tipo||'turno')==='turno'; })
        .slice().sort(function(a,b){ return minutesOf(a.inicio)-minutesOf(b.inicio); });
      for(var i=0;i<turnosDia.length-1;i++){
        var a=turnosDia[i], b=turnosDia[i+1];
        if(a.fin===b.inicio && a.personaId!==b.personaId){
          out.push({ fecha:d, de:persona(a.personaId).nombre.split(' ')[0], a:persona(b.personaId).nombre.split(' ')[0], hora:a.fin });
        }
      }
    });
    return out;
  }
  /* ---------- horas planificadas: según el cuadrante (turnos), no los fichajes reales ---------- */
  function durMin(inicio, fin){
    var a = minutesOf(inicio), b = minutesOf(fin);
    var d = b - a;
    if(d <= 0) d += 1440; // cruza medianoche (p.ej. 22:00–06:00)
    return d;
  }
  // Franja según la hora de inicio: mañana 06–14, tarde 14–22, noche 22–06.
  function franjaDe(inicioHM){
    var m = minutesOf(inicioHM);
    if(m >= 360 && m < 840) return 'manana';
    if(m >= 840 && m < 1320) return 'tarde';
    return 'noche';
  }
  function horasPlanificadas(emg){
    // La guardia es independiente del tipo base (turno/descanso), así que se suma
    // aparte siempre que esté marcada, tenga o no turno ese mismo día.
    var out = {};
    state.personas.forEach(function(p){ out[p.id] = { manana:0, tarde:0, noche:0, turno:0, guardia:0 }; });
    emg.turnos.forEach(function(t){
      var bucket = out[t.personaId];
      if(!bucket) return;
      var tipo = t.tipo||'turno';
      if(tipo==='turno' && t.inicio && t.fin){
        var min = durMin(t.inicio, t.fin);
        bucket.turno += min;
        bucket[franjaDe(t.inicio)] += min;
      }
      if(t.guardia && t.guardiaInicio && t.guardiaFin){
        bucket.guardia += durMin(t.guardiaInicio, t.guardiaFin);
      }
    });
    return out;
  }

  /* ---------- events ----------
     handleAppClick es compartido entre #app-root y los modales: un modal se añade a
     document.body (fuera de #app-root), así que sus botones necesitan el mismo despachador,
     no solo el listener de cierre. */
  function handleAppClick(ev){
    var t = ev.target.closest('[data-close]'); if(t){ closeModal(); return; }
    t = ev.target.closest('[data-open]'); if(t){ openEmg(t.getAttribute('data-open')); return; }
    t = ev.target.closest('[data-new-emg]'); if(t){ openNuevaEmergencia(); return; }
    t = ev.target.closest('[data-new-turno]'); if(t){ openNuevoTurno(t.getAttribute('data-new-turno')); return; }
    t = ev.target.closest('[data-del-turno]'); if(t){ deleteTurno(ui.emgId, t.getAttribute('data-del-turno')); return; }
    t = ev.target.closest('[data-toggle-cierre]'); if(t){ toggleCierre(t.getAttribute('data-toggle-cierre')); return; }
    t = ev.target.closest('[data-del-emg]'); if(t){ deleteEmergencia(t.getAttribute('data-del-emg')); return; }
    t = ev.target.closest('[data-go-home]'); if(t){ goHome(); return; }
    t = ev.target.closest('[data-go-horas]'); if(t){ openHoras(); return; }
    t = ev.target.closest('[data-filter-tipo]'); if(t){ ui.horasFiltro.tipo = t.getAttribute('data-filter-tipo'); render(); return; }
    t = ev.target.closest('[data-download-horas]'); if(t){ downloadHoras(); return; }
    t = ev.target.closest('[data-subtab]'); if(t){ setSubtab(t.getAttribute('data-subtab')); return; }
    t = ev.target.closest('[data-toggle-cerradas]'); if(t){ ui.showCerradas=!ui.showCerradas; render(); return; }
    t = ev.target.closest('[data-fichar]'); if(t){ ficharTipo(ui.emgId, t.getAttribute('data-fichar')); return; }
    t = ev.target.closest('[data-fichaje-manual]'); if(t){ openFichajeManual(ui.emgId); return; }
    t = ev.target.closest('[data-cal-add]'); if(t){ openNuevoTurno(ui.emgId, t.getAttribute('data-cal-persona'), t.getAttribute('data-cal-fecha')); return; }
    t = ev.target.closest('[data-cal-edit]'); if(t){ openVerTurno(t.getAttribute('data-cal-edit'), ui.emgId); return; }
    t = ev.target.closest('[data-cal-del]'); if(t){ closeModal(); deleteTurno(ui.emgId, t.getAttribute('data-cal-del')); return; }
    t = ev.target.closest('[data-cal-more]'); if(t){ ui.calDays = (ui.calDays||4)+1; render(); return; }
    t = ev.target.closest('[data-cloud-toggle]'); if(t){ toggleCloudSync(); return; }
    t = ev.target.closest('[data-go-guardia]'); if(t){ openGuardia(); return; }
    t = ev.target.closest('[data-guardia-hoy]'); if(t){ openGuardia(); return; }
    t = ev.target.closest('[data-guardia-semana]'); if(t){
      var dias = parseInt(t.getAttribute('data-guardia-semana'), 10) || 0;
      var base = new Date((ui.guardiaFecha||todayISO())+'T00:00:00');
      base.setDate(base.getDate() + dias);
      openGuardia(isoFromDate(base));
      return;
    }
  }
  function wireEvents(){
    var root = document.getElementById('app-root');
    root.onclick = handleAppClick;
    root.onchange = function(ev){
      var t = ev.target.closest('[data-filter-persona]'); if(t){ ui.horasFiltro.personaId = t.value; render(); return; }
      t = ev.target.closest('[data-filter-emg]'); if(t){ ui.horasFiltro.emgId = t.value; render(); return; }
      t = ev.target.closest('[data-guardia-fecha]'); if(t && t.value){ openGuardia(t.value); return; }
    };
  }

  /* ---------- boot ---------- */
  initCapability();
  render();
})();
</script>
