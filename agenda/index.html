<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de eventos · alta de datos</title>
<meta name="theme-color" content="#16304f">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="../shared/firebase-sync.js"></script>
<style>
  :root{
    --ink:#101828; --ink-soft:#475467; --ink-faint:#8a94a3;
    --paper:#f4f6f8; --surface:#ffffff; --surface-alt:#eef1f4;
    --border:#d3d9e0; --accent:#2a4a73; --accent-strong:#16304f; --accent-soft:#e2e9f2;
    --danger:#c8402f; --danger-soft:#f8e0db;
    --ok:#1f9d55; --ok-soft:#dff5e6;
    --warn:#c9820a; --warn-soft:#faedd0;
    --shadow: 0 1px 2px rgba(16,24,32,.05), 0 4px 12px rgba(16,24,32,.06);
    --radius-lg:14px; --radius-md:10px; --radius-sm:7px;
    --font-ui: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f4; --ink-soft:#aeb8c4; --ink-faint:#7c8798;
      --paper:#0a0e14; --surface:#131922; --surface-alt:#1a212b;
      --border:#28313d; --accent:#6f9bd1; --accent-strong:#9bc0e8; --accent-soft:#1b2938;
      --danger:#e8695a; --danger-soft:#3a1f1c;
      --ok:#4bbf82; --ok-soft:#12331f;
      --warn:#e3a83c; --warn-soft:#3a2c12;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-ui); display:flex; flex-direction:column; min-height:100dvh; }
  header.top{ display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; }
  header.top a.back{ text-decoration:none; color:var(--ink-soft); font-size:1.2rem; }
  header.top h1{ font-size:1.05rem; margin:0; }
  header.top .spacer{ flex:1; }
  .chip{ font-size:.78rem; border:1px solid var(--border); background:var(--surface-alt); border-radius:999px; padding:5px 12px; color:var(--ink-soft); cursor:pointer; }
  main{ flex:1; display:grid; grid-template-columns:320px 1fr; gap:0; min-height:0; }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } }
  aside{ border-right:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; min-height:0; }
  @media (max-width:900px){ aside{ border-right:none; border-bottom:1px solid var(--border); max-height:42vh; } }
  aside .list-head{ padding:12px 14px; display:flex; gap:8px; align-items:center; }
  aside input.search{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--paper); color:var(--ink); font-size:.85rem; }
  .btn{ border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:var(--radius-sm); padding:8px 12px; font-size:.85rem; cursor:pointer; font-family:inherit; }
  .btn:hover{ border-color:var(--accent); }
  .btn-primary{ background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
  .btn-danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .btn-sm{ padding:5px 9px; font-size:.78rem; }
  .evlist{ overflow:auto; flex:1; padding:4px 8px 16px; }
  .evlist .group{ font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:12px 8px 4px; }
  .evrow{ display:block; width:100%; text-align:left; border:1px solid transparent; background:transparent; border-radius:var(--radius-sm); padding:9px 10px; cursor:pointer; color:inherit; font-family:inherit; }
  .evrow:hover{ background:var(--surface-alt); }
  .evrow.sel{ background:var(--accent-soft); border-color:var(--accent); }
  .evrow .t{ font-weight:600; font-size:.9rem; display:flex; gap:6px; align-items:center; }
  .evrow .m{ font-size:.75rem; color:var(--ink-soft); margin-top:2px; }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .st-previsto{ background:#2f6fed; } .st-activo{ background:var(--warn); }
  .st-finalizado{ background:var(--ink-faint); } .st-cancelado{ background:var(--danger); }
  section.editor{ overflow:auto; padding:20px; }
  .editor .empty{ color:var(--ink-faint); text-align:center; padding:60px 20px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:620px){ .grid2{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:4px; margin-bottom:14px; }
  .field label{ font-size:.78rem; color:var(--ink-soft); font-weight:600; }
  .field input, .field select, .field textarea{ padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink); font-size:.9rem; font-family:inherit; }
  .field textarea{ min-height:70px; resize:vertical; }
  .check{ display:flex; align-items:center; gap:8px; font-size:.88rem; margin-bottom:14px; }
  .check input{ width:16px; height:16px; }
  h2.sec{ font-size:.95rem; margin:24px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  #map{ height:340px; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:10px; }
  .maptools{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .muni-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .muni-chip{ background:var(--accent-soft); color:var(--ink); border-radius:999px; padding:3px 10px; font-size:.8rem; display:flex; align-items:center; gap:6px; }
  .muni-chip button{ border:0; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:.9rem; line-height:1; }
  table.rows{ width:100%; border-collapse:collapse; font-size:.82rem; }
  table.rows th{ text-align:left; font-size:.72rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; padding:6px 6px; }
  table.rows td{ padding:4px 6px; border-top:1px solid var(--border); vertical-align:top; }
  table.rows input{ width:100%; padding:6px 7px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--ink); font-size:.82rem; font-family:inherit; }
  table.rows td.coord{ font-size:.72rem; color:var(--ink-soft); white-space:nowrap; }
  .row-actions{ display:flex; gap:4px; }
  .save-bar{ position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--border); padding:12px 0 4px; margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
  .gate{ max-width:360px; margin:10vh auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:26px; box-shadow:var(--shadow); }
  .gate h2{ margin:0 0 6px; font-size:1.1rem; }
  .gate p{ margin:0 0 16px; color:var(--ink-soft); font-size:.85rem; }
  .gate .err{ color:var(--danger); font-size:.8rem; min-height:1.1em; margin-top:6px; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--accent-strong); color:#fff; padding:10px 18px; border-radius:999px; font-size:.85rem; box-shadow:var(--shadow); opacity:0; transition:opacity .2s; z-index:50; pointer-events:none; }
  .toast.show{ opacity:1; }
  .hint{ font-size:.76rem; color:var(--ink-faint); margin:-6px 0 12px; }
  .cartel-prev{ max-height:120px; border-radius:8px; border:1px solid var(--border); margin-top:6px; }
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../" title="Volver al Portal">‹</a>
  <h1>Agenda de eventos — alta de datos</h1>
  <span class="spacer"></span>
  <button class="chip" id="share" hidden title="Copiar el enlace de la agenda pública para compartir">🔗 Compartir vista pública</button>
  <button class="chip" id="open" hidden title="Abrir la agenda pública en otra pestaña">↗ Abrir</button>
  <button class="chip" id="session" hidden>sesión</button>
</header>

<div id="gate" class="gate">
  <h2>Acceso restringido</h2>
  <p>Panel para dar de alta eventos de la provincia de Málaga (fiestas, cultura, deporte, cortes de tráfico…). Inicia sesión con tu cuenta del Portal 112.</p>
  <form id="f-login">
    <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="username" autofocus></div>
    <div class="field"><label>Contraseña</label><input type="password" name="password" required autocomplete="current-password"></div>
    <button type="submit" class="btn btn-primary" style="width:100%">Entrar</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<main id="app" hidden>
  <aside>
    <div class="list-head">
      <input class="search" id="search" placeholder="Buscar evento…">
      <button class="btn btn-primary btn-sm" id="new">+ Nuevo</button>
    </div>
    <div class="evlist" id="evlist"></div>
  </aside>
  <section class="editor" id="editor">
    <div class="empty">Selecciona un evento de la lista o crea uno nuevo.</div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* ------------------------------------------------------------------ *
 *  Agenda de eventos de Málaga — panel de alta (solo Coordinación 112)
 *  Escribe en Firebase RTDB, ruta  agenda/eventos/<id>
 *  El visor público (repositorio aparte) solo lee esa misma ruta.
 * ------------------------------------------------------------------ */

var MUNICIPIOS = [["Málaga","Área Metropolitana"],["Marbella","Costa del Sol Occidental"],["Estepona","Costa del Sol Occidental"],["Manilva","Costa del Sol Occidental"],["Casares","Costa del Sol Occidental"],["Benahavís","Costa del Sol Occidental"],["Ojén","Costa del Sol Occidental"],["Istán","Costa del Sol Occidental"],["Fuengirola","Costa del Sol Occidental"],["Mijas","Costa del Sol Occidental"],["Benalmádena","Costa del Sol Occidental"],["Torremolinos","Costa del Sol Occidental"],["Vélez-Málaga","Axarquía"],["Torrox","Axarquía"],["Nerja","Axarquía"],["Rincón de la Victoria","Axarquía"],["Algarrobo","Axarquía"],["Frigiliana","Axarquía"],["Cómpeta","Axarquía"],["Canillas de Albaida","Axarquía"],["Canillas de Aceituno","Axarquía"],["Alcaucín","Axarquía"],["La Viñuela","Axarquía"],["Periana","Axarquía"],["Riogordo","Axarquía"],["Alfarnate","Axarquía"],["Alfarnatejo","Axarquía"],["Colmenar","Axarquía"],["Comares","Axarquía"],["Almáchar","Axarquía"],["Benamargosa","Axarquía"],["Benamocarra","Axarquía"],["El Borge","Axarquía"],["Cútar","Axarquía"],["Iznate","Axarquía"],["Moclinejo","Axarquía"],["Salares","Axarquía"],["Sayalonga","Axarquía"],["Sedella","Axarquía"],["Árchez","Axarquía"],["Arenas","Axarquía"],["Totalán","Axarquía"],["Macharaviaya","Axarquía"],["Álora","Valle del Guadalhorce"],["Alhaurín de la Torre","Valle del Guadalhorce"],["Alhaurín el Grande","Valle del Guadalhorce"],["Almogía","Valle del Guadalhorce"],["Alozaina","Valle del Guadalhorce"],["Cártama","Valle del Guadalhorce"],["Casarabonela","Valle del Guadalhorce"],["Coín","Valle del Guadalhorce"],["Guaro","Valle del Guadalhorce"],["Monda","Valle del Guadalhorce"],["Pizarra","Valle del Guadalhorce"],["Carratraca","Valle del Guadalhorce"],["Casabermeja","Valle del Guadalhorce"],["Valle de Abdalajís","Valle del Guadalhorce"],["Tolox","Sierra de las Nieves"],["Yunquera","Sierra de las Nieves"],["El Burgo","Sierra de las Nieves"],["Parauta","Sierra de las Nieves"],["Ronda","Serranía de Ronda"],["Arriate","Serranía de Ronda"],["Benaoján","Serranía de Ronda"],["Montejaque","Serranía de Ronda"],["Cortes de la Frontera","Serranía de Ronda"],["Jimera de Líbar","Serranía de Ronda"],["Alpandeire","Serranía de Ronda"],["Algatocín","Serranía de Ronda"],["Atajate","Serranía de Ronda"],["Benadalid","Serranía de Ronda"],["Benalauría","Serranía de Ronda"],["Benarrabá","Serranía de Ronda"],["Cartajima","Serranía de Ronda"],["Faraján","Serranía de Ronda"],["Gaucín","Serranía de Ronda"],["Genalguacil","Serranía de Ronda"],["Igualeja","Serranía de Ronda"],["Jubrique","Serranía de Ronda"],["Júzcar","Serranía de Ronda"],["Pujerra","Serranía de Ronda"],["Montecorto","Serranía de Ronda"],["Serrato","Serranía de Ronda"],["Cuevas del Becerro","Serranía de Ronda"],["Campillos","Guadalteba"],["Ardales","Guadalteba"],["Teba","Guadalteba"],["Almargen","Guadalteba"],["Cañete la Real","Guadalteba"],["Sierra de Yeguas","Guadalteba"],["Antequera","Comarca de Antequera"],["Archidona","Comarca de Antequera"],["Cuevas Bajas","Comarca de Antequera"],["Cuevas de San Marcos","Comarca de Antequera"],["Fuente de Piedra","Comarca de Antequera"],["Humilladero","Comarca de Antequera"],["Mollina","Comarca de Antequera"],["Villanueva de Algaidas","Comarca de Antequera"],["Villanueva de la Concepción","Comarca de Antequera"],["Villanueva de Tapia","Comarca de Antequera"],["Villanueva del Rosario","Comarca de Antequera"],["Villanueva del Trabuco","Comarca de Antequera"],["Alameda","Comarca de Antequera"]];

var CATEGORIAS = [
  ["musica","Música / concierto","🎵"],
  ["festival","Festival","🎉"],
  ["feria","Feria / verbena","🎡"],
  ["romeria","Romería / procesión","⛪"],
  ["cultural","Cultural (teatro, cine, expo)","🎭"],
  ["tradicion","Fiesta popular / tradición","🪅"],
  ["gastronomico","Gastronómico","🍤"],
  ["deportivo","Deportivo","🏅"],
  ["prueba_deportiva","Prueba deportiva en vía pública","🚴"],
  ["institucional","Institucional / acto oficial","🏛️"],
  ["mercado","Mercado / feria comercial","🛍️"],
  ["obras","Obras / corte de carretera","🚧"],
  ["aviso","Aviso / incidencia","⚠️"],
  ["otro","Otro","📌"]
];
var ESTADOS = [["previsto","Previsto"],["activo","En curso"],["finalizado","Finalizado"],["cancelado","Cancelado"]];
var AMBITOS = [["municipal","Municipal"],["comarcal","Comarcal"],["provincial","Provincial"]];
var ENTRADAS = [["gratuito","Gratuito"],["entrada","Con entrada"],["invitacion","Con invitación / inscripción"]];
var PATH = 'agenda/eventos';
var MALAGA_CENTER = [36.72, -4.55];
var PUBLIC_URL = 'https://coordemergencias112-ux.github.io/agenda-malaga/';

var $ = function(s,r){ return (r||document).querySelector(s); };
var eventos = {}, selId = null, draft = null;
var map = null, mainMarker = null, tramoMarkers = [], routeLine = null;
var placingMode = null;   // 'main' | número de tramo | null
var drawingRoute = false;
var authUser = null;

function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2600); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function newId(){ return 'ev_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function catMeta(k){ for(var i=0;i<CATEGORIAS.length;i++) if(CATEGORIAS[i][0]===k) return CATEGORIAS[i]; return CATEGORIAS[CATEGORIAS.length-1]; }
function fmtDay(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return iso; return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}); }
function blankEvento(){
  return { id:newId(), titulo:'', categoria:'musica', estado:'previsto', ambito:'municipal',
           inicio:'', fin:'', todoElDia:false, municipios:[], lugar:'', direccion:'', lat:null, lng:null,
           descripcion:'', programa:[], organizador:'', web:'', telefono:'', entrada:'gratuito',
           entradasUrl:'', publico:'', cartelUrl:'', afeccionTrafico:false, dispositivo:'',
           tramos:[], recorrido:[] };
}

/* ---------- sesión / Firebase ---------- */
window.onPortalAuthReady = function(user){
  authUser = user || null;
  var gate = $('#gate'), app = $('#app'), sb = $('#session');
  var extra = [sb, $('#share'), $('#open')];
  if(authUser){
    gate.hidden = true; app.hidden = false;
    extra.forEach(function(b){ b.hidden = false; });
    sb.textContent = '⏻ ' + (authUser.email || 'sesión');
    startWatch();
  } else {
    gate.hidden = false; app.hidden = true;
    extra.forEach(function(b){ b.hidden = true; });
  }
};
$('#share').addEventListener('click', function(){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(PUBLIC_URL)
      .then(function(){ toast('🔗 Enlace de la agenda pública copiado'); })
      .catch(function(){ window.prompt('Copia el enlace de la agenda pública:', PUBLIC_URL); });
  } else {
    window.prompt('Copia el enlace de la agenda pública:', PUBLIC_URL);
  }
});
$('#open').addEventListener('click', function(){ window.open(PUBLIC_URL, '_blank', 'noopener'); });
$('#session').addEventListener('click', function(){
  if(window.confirm('¿Cerrar sesión en este dispositivo?') && window.PortalSync) window.PortalSync.logout();
});
$('#f-login').addEventListener('submit', function(e){
  e.preventDefault();
  var err = $('#login-err');
  if(!window.PortalSync){ err.textContent='No se pudo cargar la sincronización. Recarga la página.'; return; }
  var fd = new FormData(e.target);
  var b = e.target.querySelector('button'); b.disabled=true; b.textContent='Entrando…';
  window.PortalSync.login((fd.get('email')||'').trim(), fd.get('password')||'')
    .then(function(){ err.textContent=''; })
    .catch(function(){ err.textContent='Email o contraseña incorrectos.'; b.disabled=false; b.textContent='Entrar'; });
});

var watching = false;
function startWatch(){
  if(watching || !window.PortalSync) return;
  watching = true;
  window.PortalSync.watchData(PATH, function(remote){ eventos = remote || {}; renderList(); });
}

/* ---------- lista ---------- */
$('#search').addEventListener('input', renderList);
$('#new').addEventListener('click', function(){ openEditor(null); });

function renderList(){
  var q = ($('#search').value||'').toLowerCase().trim();
  var arr = Object.keys(eventos).map(function(k){ return eventos[k]; }).filter(Boolean);
  if(q) arr = arr.filter(function(e){
    return (e.titulo||'').toLowerCase().indexOf(q)>=0 ||
           (e.lugar||'').toLowerCase().indexOf(q)>=0 ||
           (e.municipios||[]).join(' ').toLowerCase().indexOf(q)>=0;
  });
  arr.sort(function(a,b){ return (a.inicio||'').localeCompare(b.inicio||''); });
  var now = new Date().toISOString().slice(0,10);
  var prox = arr.filter(function(e){ return (e.fin||e.inicio||'') >= now; });
  var pas  = arr.filter(function(e){ return (e.fin||e.inicio||'') <  now; }).reverse();
  var host = $('#evlist'); host.innerHTML = '';
  function block(title, list){
    if(!list.length) return;
    var h = document.createElement('div'); h.className='group'; h.textContent = title + ' (' + list.length + ')';
    host.appendChild(h);
    list.forEach(function(e){
      var cm = catMeta(e.categoria);
      var b = document.createElement('button');
      b.className = 'evrow' + (e.id===selId ? ' sel':'');
      b.innerHTML =
        '<span class="t"><span class="dot st-'+esc(e.estado)+'"></span>'+cm[2]+' '+esc(e.titulo||'(sin título)')+(e.afeccionTrafico?' 🚧':'')+'</span>'+
        '<span class="m">'+fmtDay(e.inicio)+' · '+esc((e.municipios||[]).slice(0,3).join(', ')||'sin municipio')+'</span>';
      b.addEventListener('click', function(){ openEditor(e.id); });
      host.appendChild(b);
    });
  }
  block('Próximos y en curso', prox);
  block('Finalizados', pas);
  if(!arr.length) host.innerHTML = '<div class="group">Sin eventos todavía</div>';
}

/* ---------- editor ---------- */
function openEditor(id){
  selId = id;
  draft = id && eventos[id] ? JSON.parse(JSON.stringify(eventos[id])) : blankEvento();
  ['municipios','programa','tramos','recorrido'].forEach(function(k){ if(!draft[k]) draft[k]=[]; });
  placingMode = null; drawingRoute = false;
  renderList();
  renderEditor();
}

function renderEditor(){
  var e = draft;
  var host = $('#editor');
  var opt = function(list, val){ return list.map(function(c){ return '<option value="'+c[0]+'"'+(c[0]===val?' selected':'')+'>'+(c[2]?c[2]+' ':'')+c[1]+'</option>'; }).join(''); };
  host.innerHTML =
    '<div class="grid2">'+
      '<div class="field" style="grid-column:1/-1"><label>Título del evento</label><input id="f-titulo" value="'+esc(e.titulo)+'" placeholder="Ej.: Feria de San Bernabé — Marbella"></div>'+
      '<div class="field"><label>Categoría</label><select id="f-cat">'+opt(CATEGORIAS,e.categoria)+'</select></div>'+
      '<div class="field"><label>Estado</label><select id="f-est">'+opt(ESTADOS,e.estado)+'</select></div>'+
      '<div class="field"><label>Ámbito</label><select id="f-amb">'+opt(AMBITOS,e.ambito)+'</select></div>'+
      '<div class="field"><label>Público</label><input id="f-pub" value="'+esc(e.publico)+'" placeholder="Todos los públicos / infantil / +18…"></div>'+
      '<div class="field"><label>Inicio</label><input id="f-inicio" type="datetime-local" value="'+esc(e.inicio)+'"></div>'+
      '<div class="field"><label>Fin</label><input id="f-fin" type="datetime-local" value="'+esc(e.fin)+'"></div>'+
    '</div>'+
    '<label class="check"><input type="checkbox" id="f-dia"'+(e.todoElDia?' checked':'')+'> Todo el día / sin hora concreta</label>'+

    '<h2 class="sec">Lugar</h2>'+
    '<div class="field"><label>Municipio(s) afectados</label>'+
      '<input id="f-muni-add" list="dl-muni" placeholder="Escribe y pulsa Intro para añadir">'+
      '<div class="muni-chips" id="muni-chips"></div></div>'+
    '<div class="grid2">'+
      '<div class="field"><label>Recinto / lugar</label><input id="f-lugar" value="'+esc(e.lugar)+'" placeholder="Recinto ferial, Plaza de la Constitución, Auditorio…"></div>'+
      '<div class="field"><label>Dirección</label><input id="f-dir" value="'+esc(e.direccion)+'" placeholder="Calle, nº, referencia"></div>'+
    '</div>'+
    '<div class="maptools">'+
      '<button class="btn btn-sm" id="mt-main">📍 Fijar ubicación en el mapa</button>'+
      '<button class="btn btn-sm" id="mt-mainclear">Quitar ubicación</button>'+
      '<span class="hint" id="mt-hint" style="margin:0;align-self:center"></span>'+
    '</div>'+
    '<div id="map"></div>'+

    '<h2 class="sec">Descripción y programa</h2>'+
    '<div class="field"><label>Descripción</label><textarea id="f-desc" placeholder="Texto para el público: de qué va, recomendaciones, novedades…">'+esc(e.descripcion)+'</textarea></div>'+
    '<div class="hint">Programa por horas (opcional): pasacalles, actuaciones, fuegos artificiales…</div>'+
    '<table class="rows"><thead><tr><th style="width:90px">Hora</th><th>Actividad</th><th></th></tr></thead><tbody id="prog-body"></tbody></table>'+
    '<button class="btn btn-sm" id="prog-add" style="margin-top:6px">＋ Añadir fila</button>'+

    '<h2 class="sec">Organización</h2>'+
    '<div class="grid2">'+
      '<div class="field"><label>Organiza</label><input id="f-org" value="'+esc(e.organizador)+'" placeholder="Ayuntamiento, peña, asociación, promotor…"></div>'+
      '<div class="field"><label>Entrada</label><select id="f-entrada">'+opt(ENTRADAS,e.entrada)+'</select></div>'+
      '<div class="field"><label>Web / más información</label><input id="f-web" type="url" value="'+esc(e.web)+'" placeholder="https://…"></div>'+
      '<div class="field"><label>Teléfono</label><input id="f-tel" value="'+esc(e.telefono)+'" placeholder="Contacto público"></div>'+
      '<div class="field"><label>Enlace de entradas / inscripción</label><input id="f-enturl" type="url" value="'+esc(e.entradasUrl)+'" placeholder="https://…"></div>'+
      '<div class="field"><label>Cartel (URL de imagen)</label><input id="f-cartel" type="url" value="'+esc(e.cartelUrl)+'" placeholder="https://….jpg"><img id="cartel-prev" class="cartel-prev" '+(e.cartelUrl?'src="'+esc(e.cartelUrl)+'"':'hidden')+'></div>'+
    '</div>'+
    '<div class="field"><label>Dispositivo preventivo / recursos (uso interno-informativo)</label><textarea id="f-disp" placeholder="Ej.: Protección Civil + Cruz Roja. Plan de autoprotección presentado. Ambulancia en recinto.">'+esc(e.dispositivo)+'</textarea></div>'+

    '<h2 class="sec">Afección al tráfico</h2>'+
    '<label class="check"><input type="checkbox" id="f-traf"'+(e.afeccionTrafico?' checked':'')+'> Este evento corta calles o carreteras</label>'+
    '<div id="traf-block"'+(e.afeccionTrafico?'':' hidden')+'>'+
      '<div class="hint">Cada fila es un corte. Pulsa 📍 y haz clic en el mapa para situarlo. El recorrido es una línea opcional (p. ej. el trazado de una carrera o procesión).</div>'+
      '<div class="maptools">'+
        '<button class="btn btn-sm" id="mt-route">✏️ Dibujar recorrido</button>'+
        '<button class="btn btn-sm" id="mt-undo">↶ Quitar último punto</button>'+
        '<button class="btn btn-sm" id="mt-clear">🗑️ Borrar recorrido</button>'+
      '</div>'+
      '<table class="rows"><thead><tr><th>Vía / punto</th><th>Municipio</th><th>Corte</th><th>Reapertura</th><th>Nota</th><th>Mapa</th><th></th></tr></thead><tbody id="tramo-body"></tbody></table>'+
      '<button class="btn btn-sm" id="tramo-add" style="margin-top:6px">＋ Añadir tramo</button>'+
    '</div>'+

    '<div class="save-bar">'+
      '<button class="btn btn-primary" id="save">💾 Guardar</button>'+
      '<button class="btn" id="cancel">Cancelar</button>'+
      (selId ? '<span style="flex:1"></span><button class="btn btn-danger" id="del">Eliminar evento</button>' : '')+
    '</div>'+
    '<datalist id="dl-muni">'+ MUNICIPIOS.map(function(m){ return '<option value="'+esc(m[0])+'">'+esc(m[1])+'</option>'; }).join('') +'</datalist>';

  bind('#f-titulo','input','titulo'); bind('#f-cat','change','categoria'); bind('#f-est','change','estado');
  bind('#f-amb','change','ambito'); bind('#f-pub','input','publico'); bind('#f-inicio','change','inicio');
  bind('#f-fin','change','fin'); bind('#f-lugar','input','lugar'); bind('#f-dir','input','direccion');
  bind('#f-desc','input','descripcion'); bind('#f-org','input','organizador'); bind('#f-entrada','change','entrada');
  bind('#f-web','input','web'); bind('#f-tel','input','telefono'); bind('#f-enturl','input','entradasUrl');
  bind('#f-disp','input','dispositivo');
  $('#f-dia').addEventListener('change', function(){ draft.todoElDia=this.checked; });
  $('#f-cartel').addEventListener('input', function(){
    draft.cartelUrl=this.value; var p=$('#cartel-prev');
    if(this.value){ p.src=this.value; p.hidden=false; } else { p.hidden=true; }
  });
  $('#f-muni-add').addEventListener('keydown', function(ev){
    if(ev.key!=='Enter') return; ev.preventDefault();
    var v=this.value.trim(); if(v && draft.municipios.indexOf(v)<0){ draft.municipios.push(v); renderMuniChips(); }
    this.value='';
  });
  $('#prog-add').addEventListener('click', function(){ draft.programa.push({hora:'',actividad:''}); renderPrograma(); });
  $('#f-traf').addEventListener('change', function(){
    draft.afeccionTrafico=this.checked; $('#traf-block').hidden=!this.checked;
    if(this.checked && !draft.tramos.length){ draft.tramos.push({via:'',municipio:'',corte:'',reapertura:'',nota:'',lat:null,lng:null}); }
    renderTramos(); drawTramos();
  });
  $('#tramo-add').addEventListener('click', function(){ draft.tramos.push({via:'',municipio:'',corte:'',reapertura:'',nota:'',lat:null,lng:null}); renderTramos(); });
  $('#mt-main').addEventListener('click', function(){ placingMode = (placingMode==='main'?null:'main'); drawingRoute=false; updateHint(); });
  $('#mt-mainclear').addEventListener('click', function(){ draft.lat=null; draft.lng=null; drawMain(); });
  $('#mt-route').addEventListener('click', function(){ drawingRoute=!drawingRoute; placingMode=null; updateHint(); });
  $('#mt-undo').addEventListener('click', function(){ draft.recorrido.pop(); drawRoute(); });
  $('#mt-clear').addEventListener('click', function(){ draft.recorrido=[]; drawRoute(); });
  $('#save').addEventListener('click', save);
  $('#cancel').addEventListener('click', function(){ selId=null; draft=null; $('#editor').innerHTML='<div class="empty">Selecciona un evento de la lista o crea uno nuevo.</div>'; renderList(); });
  if($('#del')) $('#del').addEventListener('click', del);

  renderMuniChips(); renderPrograma(); renderTramos();
  setTimeout(initMap, 30);

  function bind(sel, evt, key){ var el=$(sel); if(el) el.addEventListener(evt, function(){ draft[key]=this.value; }); }
}

function renderMuniChips(){
  var host=$('#muni-chips'); if(!host) return; host.innerHTML='';
  draft.municipios.forEach(function(m,i){
    var c=document.createElement('span'); c.className='muni-chip';
    c.innerHTML=esc(m)+' <button title="Quitar">✕</button>';
    c.querySelector('button').addEventListener('click', function(){ draft.municipios.splice(i,1); renderMuniChips(); });
    host.appendChild(c);
  });
}

function renderPrograma(){
  var body=$('#prog-body'); if(!body) return; body.innerHTML='';
  draft.programa.forEach(function(p,i){
    var row=document.createElement('tr');
    row.innerHTML =
      '<td><input data-k="hora" type="time" value="'+esc(p.hora)+'"></td>'+
      '<td><input data-k="actividad" value="'+esc(p.actividad)+'" placeholder="Actuación, pasacalles, castillo…"></td>'+
      '<td class="row-actions"><button class="btn btn-sm" data-act="rm">✕</button></td>';
    row.querySelectorAll('input').forEach(function(inp){ inp.addEventListener('input', function(){ p[this.getAttribute('data-k')]=this.value; }); });
    row.querySelector('[data-act="rm"]').addEventListener('click', function(){ draft.programa.splice(i,1); renderPrograma(); });
    body.appendChild(row);
  });
}

function renderTramos(){
  var body = $('#tramo-body'); if(!body) return;
  body.innerHTML = '';
  draft.tramos.forEach(function(tr, i){
    var row = document.createElement('tr');
    row.innerHTML =
      '<td><input data-k="via" value="'+esc(tr.via)+'" placeholder="A-357 / Av. de Andalucía"></td>'+
      '<td><input data-k="municipio" list="dl-muni" value="'+esc(tr.municipio)+'" placeholder="Municipio"></td>'+
      '<td><input data-k="corte" type="time" value="'+esc(tr.corte)+'"></td>'+
      '<td><input data-k="reapertura" type="time" value="'+esc(tr.reapertura)+'"></td>'+
      '<td><input data-k="nota" value="'+esc(tr.nota)+'" placeholder="desvío, sentido…"></td>'+
      '<td class="coord">'+(tr.lat!=null ? tr.lat.toFixed(4)+', '+tr.lng.toFixed(4) : '<span style="color:var(--ink-faint)">sin fijar</span>')+'</td>'+
      '<td class="row-actions"><button class="btn btn-sm" data-act="pin" title="Fijar en el mapa">📍</button><button class="btn btn-sm" data-act="rm" title="Quitar">✕</button></td>';
    row.querySelectorAll('input').forEach(function(inp){ inp.addEventListener('input', function(){ tr[this.getAttribute('data-k')]=this.value; }); });
    row.querySelector('[data-act="pin"]').addEventListener('click', function(){ placingMode = (placingMode===i ? null : i); drawingRoute=false; updateHint(); });
    row.querySelector('[data-act="rm"]').addEventListener('click', function(){ draft.tramos.splice(i,1); renderTramos(); drawTramos(); });
    body.appendChild(row);
  });
  updateHint();
  drawTramos();
}

function updateHint(){
  var h = $('#mt-hint'); if(!h) return;
  if(drawingRoute) h.textContent = 'Haz clic en el mapa para ir trazando el recorrido.';
  else if(placingMode==='main') h.textContent = 'Haz clic en el mapa para situar la ubicación principal.';
  else if(placingMode!=null && placingMode>=0) h.textContent = 'Haz clic en el mapa para situar el tramo ' + (placingMode+1) + '.';
  else h.textContent = '';
  var rb=$('#mt-route'); if(rb) rb.classList.toggle('btn-primary', drawingRoute);
  var mb=$('#mt-main'); if(mb) mb.classList.toggle('btn-primary', placingMode==='main');
}

/* ---------- mapa ---------- */
function initMap(){
  var el = $('#map'); if(!el || typeof L==='undefined') return;
  if(map){ map.remove(); map=null; }
  mainMarker=null; tramoMarkers=[]; routeLine=null;
  map = L.map(el, { scrollWheelZoom:true }).setView(MALAGA_CENTER, 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
  map.on('click', function(ev){
    var ll = ev.latlng;
    if(drawingRoute){
      draft.recorrido.push([+ll.lat.toFixed(5), +ll.lng.toFixed(5)]); drawRoute();
    } else if(placingMode==='main'){
      draft.lat=+ll.lat.toFixed(5); draft.lng=+ll.lng.toFixed(5); placingMode=null; drawMain(); updateHint();
    } else if(placingMode!=null && placingMode>=0 && draft.tramos[placingMode]){
      draft.tramos[placingMode].lat=+ll.lat.toFixed(5); draft.tramos[placingMode].lng=+ll.lng.toFixed(5);
      placingMode=null; renderTramos();
    }
  });
  drawMain(); drawTramos(); drawRoute(); fitAll();
}
function drawMain(){
  if(!map) return;
  if(mainMarker){ map.removeLayer(mainMarker); mainMarker=null; }
  if(draft.lat!=null && draft.lng!=null){
    mainMarker = L.circleMarker([draft.lat,draft.lng], { radius:10, color:'#16304f', fillColor:'#2a4a73', fillOpacity:.9, weight:2 })
      .addTo(map).bindTooltip('Ubicación del evento');
  }
}
function drawTramos(){
  if(!map) return;
  tramoMarkers.forEach(function(m){ map.removeLayer(m); });
  tramoMarkers = [];
  if(!draft.afeccionTrafico) return;
  (draft.tramos||[]).forEach(function(tr,i){
    if(tr.lat==null || tr.lng==null) return;
    var m = L.marker([tr.lat,tr.lng]).addTo(map).bindTooltip(String(i+1)+'. '+(tr.via||'tramo')+(tr.municipio?(' — '+tr.municipio):''));
    tramoMarkers.push(m);
  });
}
function drawRoute(){
  if(!map) return;
  if(routeLine){ map.removeLayer(routeLine); routeLine=null; }
  if((draft.recorrido||[]).length>1) routeLine = L.polyline(draft.recorrido, { color:'#2a4a73', weight:5, opacity:.8 }).addTo(map);
  updateHint();
}
function fitAll(){
  if(!map) return;
  var pts = [];
  if(draft.lat!=null) pts.push([draft.lat,draft.lng]);
  (draft.tramos||[]).forEach(function(t){ if(t.lat!=null) pts.push([t.lat,t.lng]); });
  (draft.recorrido||[]).forEach(function(p){ pts.push(p); });
  if(pts.length) map.fitBounds(pts, { padding:[40,40], maxZoom:15 });
}

/* ---------- guardar / borrar ---------- */
function clean(o){ // quita strings vacíos y arrays vacíos para no ensuciar la BD
  var out = Array.isArray(o) ? [] : {};
  Object.keys(o).forEach(function(k){
    var v = o[k];
    if(v===''||v==null) return;
    if(Array.isArray(v)){ if(!v.length) return; out[k]=v.map(function(x){ return (x && typeof x==='object') ? clean(x) : x; }); }
    else if(typeof v==='object'){ out[k]=clean(v); }
    else out[k]=v;
  });
  return out;
}
function save(){
  if(!draft.titulo.trim()){ toast('Ponle un título al evento'); return; }
  if(!draft.inicio){ toast('Indica al menos la fecha de inicio'); return; }
  var obj = clean(draft);
  obj.id = draft.id;
  obj.afeccionTrafico = !!draft.afeccionTrafico;
  obj.todoElDia = !!draft.todoElDia;
  obj.actualizado = new Date().toISOString();
  obj.autor = authUser ? (authUser.email || authUser.uid) : '';
  window.PortalSync.saveData(PATH + '/' + obj.id, obj)
    .then(function(){ toast('✔ Guardado'); selId = obj.id; })
    .catch(function(){ toast('✖ Error al guardar (revisa la conexión)'); });
}
function del(){
  if(!selId) return;
  if(!window.confirm('¿Eliminar este evento de la agenda? No se puede deshacer.')) return;
  window.PortalSync.saveData(PATH + '/' + selId, null)
    .then(function(){ toast('Evento eliminado'); selId=null; draft=null; $('#editor').innerHTML='<div class="empty">Selecciona un evento de la lista o crea uno nuevo.</div>'; renderList(); })
    .catch(function(){ toast('✖ No se pudo eliminar'); });
}
</script>
</body>
