name: Actualizar alertas Málaga (AEMET)

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch: {}       # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update-aemet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar scraper AEMET
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python alertas-malaga/scripts/aemet_scraper.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "aemet-bot"
          git config user.email "actions@github.com"
          git add alertas-malaga/data/aemet_malaga.json
          git diff --cached --quiet || git commit -m "Actualizar avisos y previsión AEMET Málaga"
          git push
