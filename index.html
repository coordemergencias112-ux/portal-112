<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal 112</title>
<meta name="theme-color" content="#16304f">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --ink:#101828; --ink-soft:#475467; --ink-faint:#8a94a3;
    --paper:#f4f6f8; --surface:#ffffff; --surface-alt:#eef1f4;
    --border:#d3d9e0; --accent:#2a4a73; --accent-strong:#16304f; --accent-soft:#e2e9f2;
    --shadow: 0 1px 2px rgba(16,24,32,.05), 0 4px 12px rgba(16,24,32,.06);
    --radius-lg:14px; --radius-md:10px;
    --font-ui: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f4; --ink-soft:#aeb8c4; --ink-faint:#7c8798;
      --paper:#0a0e14; --surface:#131922; --surface-alt:#1a212b;
      --border:#28313d; --accent:#6f9bd1; --accent-strong:#9bc0e8; --accent-soft:#1b2938;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; background:var(--paper); color:var(--ink);
    font-family:var(--font-ui);
    display:flex; flex-direction:column; align-items:center;
    padding:max(24px, env(safe-area-inset-top)) 20px 32px;
  }
  header{ width:100%; max-width:720px; text-align:center; margin-bottom:28px; }
  header h1{ font-size:1.5rem; margin:0 0 4px; letter-spacing:.02em; }
  header p{ margin:0; color:var(--ink-soft); font-size:.95rem; }
  .grid{
    width:100%; max-width:720px; display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px;
  }
  a.tile{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow); padding:26px 14px; text-decoration:none; color:var(--ink);
    transition:transform .12s ease, border-color .12s ease;
  }
  a.tile:hover, a.tile:focus-visible{ transform:translateY(-2px); border-color:var(--accent); outline:none; }
  a.tile .icon{ font-size:2.1rem; line-height:1; }
  a.tile .label{ font-weight:600; font-size:.95rem; text-align:center; }
  a.tile .sub{ font-size:.75rem; color:var(--ink-faint); text-align:center; }
  .tile.disabled{ opacity:.45; pointer-events:none; }
  .badge-ext{
    font-size:.65rem; font-weight:700; color:var(--accent-strong); background:var(--accent-soft);
    border-radius:999px; padding:2px 8px; letter-spacing:.02em;
  }
  footer{ margin-top:36px; font-size:.75rem; color:var(--ink-faint); text-align:center; }
</style>
</head>
<body>
  <header>
    <h1>Portal 112</h1>
    <p>Selecciona un módulo</p>
  </header>

  <nav class="grid" id="grid"></nav>

  <footer>Coordinación de Emergencias 112</footer>

<script>
  // Añadir módulos aquí según se vayan incorporando.
  var MODULOS = [
    {
      label: "Alertas Málaga",
      sub: "Sismos, avisos AEMET y previsión",
      icon: "🌩️",
      href: "alertas-malaga/",
      external: false
    },
    {
      label: "Sismos",
      sub: "Visor de sismicidad de Andalucía",
      icon: "🌍",
      href: "https://coordemergencias112-ux.github.io/visor-sismos-andalucia/",
      external: true
    },
    {
      label: "Fichaje / Turnos",
      sub: "Guardia 112",
      icon: "🕒",
      href: "turnos/",
      external: false
    },
    {
      label: "Mi Panel",
      sub: "Panel de indicadores personalizado",
      icon: "🧩",
      href: "panel-control/",
      external: false
    },
    {
      label: "Documentos",
      sub: "Plantillas y archivos de referencia",
      icon: "📚",
      href: "documentos/",
      external: false
    },
    {
      label: "Guardias EMA",
      sub: "Coordinación y asesoría técnica",
      icon: "🚑",
      href: "https://ema112guard-wjtdifsb.manus.space/",
      external: true
    }
  ];

  var grid = document.getElementById('grid');
  MODULOS.forEach(function(m){
    var a = document.createElement('a');
    a.className = 'tile';
    a.href = m.href;
    if (m.external) { a.target = '_blank'; a.rel = 'noopener'; }
    a.innerHTML =
      '<span class="icon">' + m.icon + '</span>' +
      '<span class="label">' + m.label + '</span>' +
      '<span class="sub">' + m.sub + '</span>' +
      (m.external ? '<span class="badge-ext">↗ externo</span>' : '');
    grid.appendChild(a);
  });
</script>
</body>
</html>
